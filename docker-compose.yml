# CHI DUNG DE TEST LOCAL (docker compose up), KHONG duoc dung file nay tren Coolify.
#
# Ly do: Coolify tu dung port 8000 cho chinh bang dieu khien cua no
# (0.0.0.0:8000->8080 tren container "coolify"). App chatbot production duoc deploy
# bang Coolify "Build Strategy: Dockerfile" (khong doc file nay), Coolify tu lo viec
# lo dien app ra ngoai qua Traefik cua no, KHONG bind thang host port 8000. Ngay
# 2026-09-22 co doi thu Build Strategy cua app nay sang "Compose" de test dong bo,
# khien port "8000:8000" khai o duoi dung do thang vao port Coolify dang giu - lam
# sap demo that ~20 phut. Xem log.md/can-xu-ly.md ben wiki_obsidian de biet chi tiet.
#
# Co che dong bo vault: Google Drive, dong bo 2 chieu bang rclone (khong co client
# Drive chinh thuc chay tren Linux server nen dung rclone o service "drive-sync"
# duoi day, xem drive-sync/) - da tung thu Seafile tu host (server rieng) nhung bo
# vi qua nhieu chi phi van hanh (Docker networking, thieu label Traefik, phai tu
# quan ly MariaDB/Redis...) so voi loi ich thuc te, xem log.md ben wiki_obsidian
# ngay 2026-09-28 de biet chi tiet ly do doi huong.
services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Viet Anh Staff Assistant"
      ENVIRONMENT: "production"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      ALLOWED_EMAIL_DOMAINS: "${ALLOWED_EMAIL_DOMAINS}"
      EMBEDDING_PROVIDER: "openrouter"
      LLM_PROVIDER: "openrouter"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "google/gemini-2.5-flash"
      OPENROUTER_EMBEDDING_MODEL: "openai/text-embedding-3-small"
      OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      TOP_K: "20"
      MIN_RELEVANCE_SCORE: "0.22"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      VAULT_PATH: "/data/vault"
      VAULT_READY_MARKER: ".drive-sync-ready"
    volumes:
      - vault-data:/data/vault
      - app-data:/app/data
    restart: unless-stopped

  # Giu /data/vault dong bo 2 chieu voi 1 thu muc goc tren Google Drive, bang
  # rclone bisync - dung 1 tai khoan Google rieng (khong phai ca nhan ai) "so huu"
  # toan bo thu muc vault, roi share tung thu muc con ra cho dung nguoi/nhom that
  # (leader, CEO...) voi quyen xem/sua phu hop - giong cach lam voi Seafile library
  # truoc day, chi khac cong cu.
  drive-sync:
    build: ./drive-sync
    environment:
      DRIVE_RCLONE_CONFIG_B64: "${DRIVE_RCLONE_CONFIG_B64}"
      DRIVE_REMOTE_NAME: "${DRIVE_REMOTE_NAME}"
      DRIVE_FOLDER_PATH: "${DRIVE_FOLDER_PATH}"
      VAULT_PATH: "/data/vault"
      DRIVE_SYNC_STATE_DIR: "/data/drive-sync-state"
    volumes:
      - vault-data:/data/vault
      - drive-sync-state:/data/drive-sync-state
    restart: unless-stopped

volumes:
  vault-data:
  app-data:
  drive-sync-state:
