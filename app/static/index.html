<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#26275D">
  <title>Trợ lý nội bộ · Trường Việt Anh</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Trang dự phòng: main.py chỉ trả trang này khi frontend/dist chưa được build (chạy local
       mà chưa "npm run build"). Giao diện thật là app React trong frontend/. Theo Brand
       Guideline Trường Việt Anh: Navy #26275D, Vàng #F9DD0E cho CTA, Be Vietnam Pro, chữ ≥16px. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #F0F4F8; color: #1A1A2E; font-family: 'Be Vietnam Pro', Arial, sans-serif; font-size: 16px; line-height: 1.6; }
    .card { width: 100%; max-width: 560px; background: #fff; border: 1px solid #E2E8F0; border-radius: 20px; padding: 36px 32px; box-shadow: 0 8px 24px rgba(38,39,93,.06); text-align: center; }
    img { width: 230px; height: auto; }
    h1 { margin: 24px 0 8px; color: #26275D; font-size: 28px; font-weight: 800; line-height: 1.25; }
    p { margin: 0 0 12px; color: #555873; }
    code { padding: 2px 8px; border-radius: 8px; background: #F0F4F8; color: #26275D; font-family: inherit; font-weight: 600; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    .cta { background: #F9DD0E; color: #26275D; }
    .cta:hover { background: #E5C900; }
    .outline { border: 1px solid #E2E8F0; color: #26275D; }
    .outline:hover { background: #F0F4F8; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/brand/logo-vietanh.webp" alt="Trường Việt Anh">
    <h1>Trợ lý nội bộ</h1>
    <p>Backend đang chạy nhưng giao diện trò chuyện chưa được build.</p>
    <p>Chạy <code>npm run build</code> trong thư mục <code>frontend</code>, hoặc mở bản dev tại cổng 5173.</p>
    <div class="actions">
      <a class="cta" href="http://localhost:5173">Mở giao diện dev</a>
      <a class="outline" href="/admin">Trang quản trị</a>
    </div>
  </main>
</body>
</html>
