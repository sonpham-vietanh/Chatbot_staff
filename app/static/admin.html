<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14153A">
<title>Quản trị tri thức · Trường Việt Anh</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Việt Anh Design System — refactor 2026-07 "Học viện Quốc tế" (docs/design handoff):
     navy #14153A, CTA vàng gradient chữ navy, gold #E8C40A cho điểm nhấn, nền kem #FAF9F4,
     viền #E7E5DA; font Manrope, chỉ sans-serif, cỡ chữ tối thiểu 16px; nút vuông. */
  :root {
    --navy: #14153A; --navy-900: #0D0E2B; --navy-600: #26275D; --navy-100: #E2E3F0;
    --cta: linear-gradient(180deg, #F9DD0E 0%, #E0B90C 100%); --gold: #E8C40A; --gold-text: #7A5F00;
    --cream: #FAF9F4; --cream-hover: #FBF6DC; --line: #E7E5DA; --ink: #1A1A2E; --muted: #54556E; --placeholder: #6B6C85;
    --success: #1E7F4F; --danger: #E03C31; --ease: cubic-bezier(.4,0,.2,1);
    --dark-bg: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(160deg, #14153A 0%, #1C1D4A 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { color: var(--ink); background: var(--cream); font-family: 'Manrope', Arial, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; font-size: 16px; }
  a { color: var(--navy-600); text-decoration: none; font-weight: 600; }
  a:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 4px; }
  input::placeholder, textarea::placeholder { color: var(--placeholder); }
  :focus-visible { outline: 3px solid var(--navy-100); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .rule { width: 34px; height: 2px; background: var(--gold); }

  /* ---- nút (vuông, letter-spacing .03em, hover nhấc lên) ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 26px; border: 1px solid transparent; border-radius: 0; font-weight: 700; letter-spacing: .03em; line-height: 1.2; cursor: pointer; white-space: nowrap; transition: transform .18s var(--ease), box-shadow .18s var(--ease); }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,21,58,.12); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--cta); color: var(--navy); box-shadow: 0 6px 18px rgba(224,185,12,.30); }
  .btn-secondary { background: var(--navy); color: #fff; }
  .btn-outline { background: transparent; color: var(--navy); border-color: var(--navy); }
  .btn-ghost { background: transparent; color: var(--navy-600); }
  .btn-ghost:hover:not(:disabled) { box-shadow: none; }
  .btn-danger { background: none; color: var(--danger); }
  .btn-danger:hover:not(:disabled) { border-color: var(--danger); box-shadow: none; transform: none; }
  .btn-lg { padding: 16px 34px; font-size: 17px; }
  .btn-sm { padding: 9px 16px; }
  .btn-block { width: 100%; }

  /* ---- field ---- */
  .field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; color: var(--navy); }
  .field input, .field select, .field textarea { height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font-weight: 400; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; }
  .field select { padding: 0 12px; }
  .field input:focus, .field select:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-100); }
  .field textarea { height: auto; min-height: 320px; padding: 14px 16px; background: var(--cream); line-height: 1.65; resize: vertical; }
  .field textarea:focus { border-color: var(--navy); background: #fff; }
  .field.full { grid-column: 1 / -1; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  .muted { margin: 0; color: var(--muted); line-height: 1.6; }

  /* ---- đăng nhập token ---- */
  #login { min-height: 100%; display: grid; place-items: center; padding: 32px 20px; background-color: var(--navy); background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(135deg, #14153A 0%, #26275D 100%); background-size: 18px 18px, 100% 100%; }
  .login-card { width: 100%; max-width: 440px; background: #fff; padding: 44px 40px 36px; border-radius: 10px; box-shadow: 0 24px 60px rgba(13,14,43,.35); }
  .login-card img { display: block; width: 170px; height: auto; margin-top: 24px; }
  .login-card h1 { margin: 32px 0 0; font-size: 30px; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .login-card .muted { margin-top: 8px; }
  .login-card .field { margin-top: 28px; }
  .login-card .field input { height: 50px; padding: 0 16px; }
  .login-error { margin: 10px 0 0; color: var(--danger); min-height: 0; }
  .login-card .btn { margin-top: 20px; }
  .login-card .back { display: block; margin-top: 20px; padding: 10px 0; min-height: 40px; text-align: center; }

  /* ---- khung app ---- */
  #app { height: 100%; display: flex; }
  nav.side { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 28px 16px 20px; color: #fff; background-color: var(--navy); background-image: var(--dark-bg); background-size: 18px 18px, 100% 100%; }
  .side-brand { display: flex; flex-direction: column; gap: 6px; padding: 0 12px 28px; }
  .wordmark { font-weight: 800; letter-spacing: .14em; }
  .side-brand .sub { font-weight: 600; color: var(--gold); }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: transparent; border: 0; border-radius: 0; text-align: left; white-space: nowrap; color: #C9CAE0; font-weight: 600; cursor: pointer; transition: background .15s; }
  .nav-item:hover { background: rgba(255,255,255,.06); }
  .nav-item .dot { width: 6px; height: 6px; flex-shrink: 0; background: transparent; }
  .nav-item.active { background: rgba(255,255,255,.09); color: #fff; font-weight: 700; }
  .nav-item.active .dot { background: var(--gold); }
  .nav-count { margin-left: auto; padding: 0 8px; background: #F9DD0E; color: var(--navy); font-weight: 800; line-height: 1.5; }
  .side-foot { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: 12px; }
  .side-foot a { color: #E2E3F0; }
  .side-foot a:hover { color: #fff; }
  .btn-dark { height: 42px; background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 0; color: #E2E3F0; font-weight: 600; cursor: pointer; transition: border-color .15s, color .15s; }
  .btn-dark:hover { border-color: rgba(255,255,255,.45); color: #fff; }

  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--cream); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; background: #fff; border-bottom: 1px solid var(--line); }
  .topbar .crumb { font-weight: 700; color: var(--gold-text); }
  .topbar h1 { margin: 2px 0 0; font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .actions-slot { flex-shrink: 0; white-space: nowrap; }
  .content { flex: 1; min-height: 0; overflow: auto; }

  @media (max-width: 820px) {
    #app { flex-direction: column; }
    nav.side { width: 100%; flex-direction: row; padding: 8px 12px; overflow-x: auto; }
    .side-brand, .side-foot { display: none; }
    .nav-count { margin-left: 8px; }
    .topbar { padding: 14px 16px; }
    .topbar h1 { font-size: 20px; }
  }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .page { max-width: 820px; padding: 28px; }
  .page .card { padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 20px; border-top: 1px solid var(--line); }
  @media (max-width: 640px) { .page { padding: 16px; } .page .card { padding: 20px; } }

  /* ---- tri thức ---- */
  .notes-grid { display: grid; grid-template-columns: 400px minmax(0,1fr); gap: 24px; padding: 24px 28px 40px; align-items: start; }
  @media (max-width: 1100px) { .notes-grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .notes-grid { padding: 16px; } }
  .notes-list { overflow: hidden; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { flex: 1; padding: 14px 10px 12px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; }
  .tab.active { border-bottom-color: var(--navy); color: var(--navy); font-weight: 700; }
  .list-tools { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .list-tools input { height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--cream); color: var(--ink); outline: none; }
  .list-tools input:focus { border-color: var(--navy); background: #fff; }
  .list-tools span { color: var(--muted); }
  #list { max-height: 64vh; overflow-y: auto; }
  .empty { margin: 0; padding: 48px 20px; text-align: center; color: var(--muted); }
  .note-row { padding: 16px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .note-row:last-child { border-bottom: 0; }
  .note-row:hover { background: var(--cream-hover); }
  .note-row.active { background: #F2F1EA; }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-title { font-weight: 700; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { margin-top: 4px; color: var(--muted); }
  .row-meta.gap { color: var(--gold-text); font-weight: 700; }
  .row-preview { margin-top: 6px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { flex-shrink: 0; padding: 1px 10px; border-radius: 3px; font-weight: 700; background: #FBF6DC; color: #6B5600; }
  .badge.approved, .badge.active { background: #E3F2EA; color: #14532D; }
  .badge.rejected, .badge.revoked { background: #FCE4E2; color: #8A1C14; }

  .editor-empty { padding: 96px 32px; text-align: center; }
  .editor-empty .rule { margin: 0 auto 20px; }
  .editor-empty p:first-of-type { margin: 0; font-size: 18px; font-weight: 700; color: var(--navy); }
  .editor-empty p + p { margin: 8px 0 0; color: var(--muted); }
  .editor-body { padding: 28px; }
  @media (max-width: 640px) { .editor-body { padding: 20px; } }
  .gap-box { margin-bottom: 20px; padding: 14px 16px; background: var(--cream-hover); border-radius: 6px; line-height: 1.6; }
  .gap-box strong { color: var(--navy); }
  .editor-body > .field { margin-top: 20px; }
  .editor-body .actions { margin-top: 24px; }
  .editor-body .actions .btn-danger { margin-left: auto; }

  /* ---- upload ---- */
  .drop-zone { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 20px; background: #fff; border: 2px dashed #D6D3C4; border-radius: 0; cursor: pointer; text-align: center; transition: background .15s, border-color .15s; }
  .drop-zone:hover { border-color: var(--navy); }
  .drop-zone.drag { background: var(--navy-100); border-color: var(--navy); }
  .drop-zone.picked { background: var(--cream-hover); }
  .drop-zone strong { font-size: 18px; color: var(--navy); }
  .drop-zone span { color: var(--muted); }

  /* ---- thống kê ---- */
  .feedback { max-width: 980px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 640px) { .feedback { padding: 16px; } }
  .feedback-tabs { overflow: hidden; }
  .feedback-tabs .tabs { border-bottom: 0; }
  #feedbackList { display: flex; flex-direction: column; gap: 20px; }
  .fb-card { overflow: hidden; }
  .fb-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .fb-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge.fb-reason { background: #FCE4E2; color: #8A1C14; }
  .fb-meta { color: var(--muted); }
  .fb-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .fb-label { display: block; margin-bottom: 6px; font-weight: 700; color: var(--gold-text); }
  .fb-question { margin: 0; font-size: 17px; font-weight: 700; color: var(--navy); }
  .fb-answer { padding: 14px 16px; background: var(--cream); border-radius: 6px; line-height: 1.65; }
  .fb-answer strong { color: var(--navy); }
  .fb-note { padding: 12px 14px; background: var(--cream-hover); border-radius: 6px; line-height: 1.6; }
  .fb-note strong { color: var(--navy); }
  .fb-sources { display: flex; flex-wrap: wrap; gap: 8px; }
  .fb-source { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: #fff; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); cursor: pointer; text-align: left; }
  .fb-source:hover { background: var(--cream-hover); border-color: var(--navy); }
  .fb-source strong { color: var(--navy); }
  .fb-actions { margin: 0 24px; padding: 16px 0 20px; }
  .stats { max-width: 1040px; padding: 28px; display: flex; flex-direction: column; gap: 24px; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .stat-card { padding: 24px; }
  .stat-card .value { margin-top: 16px; font-size: 40px; font-weight: 800; color: var(--navy); line-height: 1.1; }
  .stat-card .label { margin-top: 6px; color: var(--muted); }
  .stat-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
  @media (max-width: 640px) { .stats { padding: 16px; } .stat-lists { grid-template-columns: 1fr; } }
  .stat-list { padding: 24px; }
  .stat-list h2 { margin: 0 0 8px; font-size: 18px; font-weight: 800; color: var(--navy); }
  .stat-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .stat-row:last-child { border-bottom: 0; }
  .stat-row .rank { font-weight: 700; color: var(--gold-text); }
  .stat-row .mid { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .stat-row .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-row .bar { height: 4px; background: var(--navy-100); }
  .stat-row .bar i { display: block; height: 100%; background: var(--navy); }
  .stat-row .count { font-weight: 800; color: var(--navy); }

  /* ---- API nhúng ---- */
  .keys { max-width: 900px; padding: 28px; display: flex; flex-direction: column; gap: 24px; }
  @media (max-width: 640px) { .keys { padding: 16px; } }
  .keys > .card:first-child { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .keys > .card.pad { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .keys h2 { margin: 0; font-size: 18px; font-weight: 800; color: var(--navy); }
  .key-card { overflow: hidden; }
  .key-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 28px; border-bottom: 1px solid var(--line); }
  .key-head .name { display: flex; align-items: center; gap: 10px; }
  .key-head .name strong { font-size: 18px; color: var(--navy); }
  .key-head .meta { color: var(--muted); }
  .key-head .btns { display: flex; gap: 8px; }
  .key-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; background: var(--cream); }
  .key-body > .label { font-weight: 700; color: var(--gold-text); }
  .snippet { display: flex; flex-direction: column; gap: 6px; }
  .snippet > span { font-weight: 700; color: var(--navy); }
  .snippet .box { display: flex; align-items: stretch; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .snippet pre { flex: 1; min-width: 0; margin: 0; padding: 12px 14px; font-family: 'Manrope', Arial, sans-serif; font-size: 16px; line-height: 1.55; color: var(--ink); white-space: pre-wrap; word-break: break-all; }
  .snippet button { flex-shrink: 0; padding: 0 16px; background: #fff; border: 0; border-left: 1px solid var(--line); border-radius: 0; font-weight: 700; color: var(--navy-600); cursor: pointer; }
  .snippet button:hover { background: var(--cream-hover); }
  .note-box { margin: 4px 0 0; padding: 12px 14px; background: var(--cream-hover); border-radius: 6px; }
  .note-box strong { color: var(--navy); }


  /* ---- danh bạ nhân sự & yêu cầu chỉnh sửa ---- */
  .dir { max-width: 1280px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 640px) { .dir { padding: 16px; } }
  .dir-tools { padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .dir-tools input[type=search] { flex: 1 1 260px; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--cream); color: var(--ink); outline: none; }
  .dir-tools input[type=search]:focus { border-color: var(--navy); background: #fff; }
  .dir-tools .tabs { flex: 0 0 auto; border-bottom: 0; }
  .dir-tools .tab { flex: 0 0 auto; padding: 10px 16px; }
  .dir-tools .spacer { flex: 1 1 auto; }
  .dir-table-wrap { overflow-x: auto; }
  table.dir-table { width: 100%; border-collapse: collapse; }
  .dir-table th { padding: 12px 14px; text-align: left; font-weight: 700; color: var(--gold-text); background: var(--cream); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .dir-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .dir-table tr:last-child td { border-bottom: 0; }
  .dir-table td.name { font-weight: 700; color: var(--navy); }
  .dir-table td.acts { min-width: 150px; }
  .dir-table td.acts .btn { padding: 6px 12px; margin: 0 6px 6px 0; }
  .dir-table .badge { white-space: nowrap; display: inline-block; }
  .dir-pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--line); color: var(--muted); flex-wrap: wrap; }
  .dir-pager .btns { display: flex; gap: 8px; }
  .dir-panel { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .dir-panel h2 { margin: 0; font-size: 18px; font-weight: 800; color: var(--navy); }
  .dir-sum { display: flex; flex-wrap: wrap; gap: 10px; }
  .dir-sum .badge { padding: 4px 14px; }
  .badge.err { background: #FCE4E2; color: #8A1C14; }
  .badge.off { background: #ECECF3; color: #54556E; }
  .dir-err { margin: 0; padding-left: 20px; color: #8A1C14; line-height: 1.6; }
  .chg { display: block; color: var(--muted); }
  .chg b { color: var(--navy); font-weight: 700; }
  .form-err { margin: 0; padding: 12px 14px; background: #FCE4E2; color: #8A1C14; border-radius: 6px; font-weight: 600; }
  .req-card { overflow: hidden; }
  .req-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .req-change { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; background: var(--cream); border-radius: 6px; }
  .req-change .old { color: var(--muted); text-decoration: line-through; }
  .req-change .new { color: var(--navy); font-weight: 800; }
  .req-change .arrow { color: var(--gold-text); font-weight: 800; }
  .req-act { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .req-act .field { flex: 1 1 280px; }
  .req-act .field input { height: 44px; }
  .field input.bad { border-color: var(--danger); }
  /* ---- hộp thoại ---- */
  #modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow: auto; background: rgba(13,14,43,.55); }
  .modal-card { width: 100%; max-width: 760px; background: #fff; border-radius: 10px; box-shadow: 0 24px 60px rgba(13,14,43,.35); padding: 28px; display: flex; flex-direction: column; gap: 18px; }
  .modal-card h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--navy); }
  .hist-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hist-row:last-child { border-bottom: 0; }
  .hist-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .hist-top strong { color: var(--navy); }
  .hist-top span { color: var(--muted); }

  /* ---- toast ---- */
  #toast { position: fixed; top: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .toast-item { max-width: 380px; padding: 14px 18px; background: var(--navy); color: #fff; font-weight: 600; box-shadow: 0 12px 28px rgba(13,14,43,.25); animation: vaToast .2s var(--ease) both; }
  .toast-item.error { background: var(--danger); }
  @keyframes vaToast { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="login-card">
    <div class="rule"></div>
    <img src="/brand/logo-vietanh.webp" alt="Trường Việt Anh">
    <h1>Quản trị tri thức</h1>
    <p class="muted">Nhập admin token để quản lý nội dung trợ lý nội bộ.</p>
    <label class="field">Admin token
      <input id="tokenInput" type="password" placeholder="••••••••••••" autocomplete="off">
    </label>
    <p class="login-error" id="loginError" role="alert"></p>
    <button class="btn btn-primary btn-lg btn-block" id="loginBtn">Vào trang quản trị →</button>
    <a class="back" href="/">← Về trợ lý nội bộ</a>
  </div>
</div>

<div id="app" hidden>
  <nav class="side" aria-label="Điều hướng quản trị">
    <div class="side-brand"><span class="wordmark">TRƯỜNG VIỆT ANH</span><span class="sub">Quản trị tri thức</span></div>
    <button class="nav-item" data-view="notes"><span class="dot"></span>Tri thức<span class="nav-count" id="draftCount" hidden></span></button>
    <button class="nav-item" data-view="feedback"><span class="dot"></span>Báo sai<span class="nav-count" id="feedbackCount" hidden></span></button>
    <button class="nav-item" data-view="upload"><span class="dot"></span>Upload file</button>
    <button class="nav-item" data-view="stats"><span class="dot"></span>Thống kê</button>
    <button class="nav-item" data-view="directory"><span class="dot"></span>Danh bạ nhân sự</button>
    <button class="nav-item" data-view="requests"><span class="dot"></span>Yêu cầu chỉnh sửa<span class="nav-count" id="requestCount" hidden></span></button>
    <button class="nav-item" data-view="leaders"><span class="dot"></span>Leader</button>
    <button class="nav-item" data-view="report"><span class="dot"></span>Kết nối Major OS</button>
    <button class="nav-item" data-view="keys"><span class="dot"></span>API nhúng</button>
    <div class="side-foot">
      <a href="/">← Về trợ lý nội bộ</a>
      <button class="btn-dark" id="logoutBtn">Đăng xuất</button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div style="min-width: 0;">
        <div class="crumb" id="crumb">Tri thức</div>
        <h1 id="pageTitle">Danh sách note</h1>
      </div>
      <div class="actions-slot"><button class="btn btn-primary" id="newNoteBtn">+ Note mới</button></div>
    </header>

    <div class="content">
      <!-- Tri thức -->
      <div class="notes-grid" id="view-notes">
        <section class="card notes-list">
          <div class="tabs" role="tablist">
            <button class="tab active" data-status="draft">Chờ duyệt</button>
            <button class="tab" data-status="approved">Đã duyệt</button>
            <button class="tab" data-status="rejected">Từ chối</button>
            <button class="tab" data-status="all">Tất cả</button>
          </div>
          <div class="list-tools">
            <input id="noteSearch" type="search" placeholder="Tìm tiêu đề, phòng ban…" aria-label="Tìm note theo tiêu đề, phòng ban hoặc nội dung">
            <span id="listSummary" aria-live="polite"></span>
          </div>
          <div id="list"></div>
        </section>
        <section class="card" id="editorPanel"><div id="editor"></div></section>
      </div>

      <!-- Note mới -->
      <div class="page" id="view-new" hidden>
        <section class="card">
          <div class="grid-2">
            <label class="field">Tiêu đề<input id="newTitle" placeholder="Vd: Quy định nghỉ phép 2026"></label>
            <label class="field">Phòng ban<select id="newDepartment"></select></label>
          </div>
          <label class="field">Nội dung (Markdown)<textarea id="newContent" placeholder="Nhập nội dung quy định…" style="min-height: 340px;"></textarea></label>
          <div class="actions">
            <button class="btn btn-secondary" id="createApprovedBtn">Lưu &amp; duyệt luôn</button>
            <button class="btn btn-outline" id="createDraftBtn">Lưu nháp</button>
          </div>
        </section>
      </div>

      <!-- Upload -->
      <div class="page" id="view-upload" hidden>
        <section class="card">
          <div class="grid-2">
            <label class="field">Phòng ban<select id="uploadDepartment"></select></label>
            <label class="field">Tiêu đề (tuỳ chọn)<input id="uploadTitle" placeholder="Để trống sẽ lấy theo tên file"></label>
          </div>
          <button type="button" class="drop-zone" id="dropZone"><strong id="dropTitle">Kéo thả file vào đây, hoặc bấm để chọn</strong><span>.md .txt .csv .json .pdf .docx · tối đa 10MB</span></button>
          <input type="file" id="uploadFileInput" hidden accept=".md,.txt,.csv,.json,.pdf,.docx">
          <p class="muted">File được duyệt tự động và trợ lý dùng được ngay. Kiểm tra lại nội dung trong danh sách note nếu cần chỉnh sửa.</p>
          <div class="actions"><button class="btn btn-secondary" id="uploadSubmitBtn" disabled>Upload &amp; duyệt tự động</button></div>
        </section>
      </div>

      <!-- Báo sai -->
      <div class="feedback" id="view-feedback" hidden>
        <div class="card feedback-tabs">
          <div class="tabs" role="tablist">
            <button class="tab active" data-fstatus="open">Chưa xử lý</button>
            <button class="tab" data-fstatus="resolved">Đã sửa</button>
            <button class="tab" data-fstatus="dismissed">Bỏ qua</button>
            <button class="tab" data-fstatus="all">Tất cả</button>
          </div>
        </div>
        <div id="feedbackList"></div>
      </div>

      <!-- Thống kê -->
      <div class="stats" id="view-stats" hidden></div>

      <!-- Kết nối Major OS -->
      <div class="keys" id="view-report" hidden></div>

      <!-- Danh bạ nhân sự -->
      <div class="dir" id="view-directory" hidden></div>

      <!-- Yêu cầu chỉnh sửa -->
      <div class="dir" id="view-requests" hidden></div>

      <!-- Leader phòng ban -->
      <div class="keys" id="view-leaders" hidden></div>

      <!-- API nhúng -->
      <div class="keys" id="view-keys" hidden></div>
    </div>
  </div>
</div>

<div id="modal" hidden></div>
<div id="toast"></div>

<script>
const API = "/api/admin";
const DEPARTMENTS = ["Unassigned", "HR", "Finance", "Academic", "Admin"];
const ACCESS_LEVELS = ["staff", "manager", "admin"];
const STATUSES = ["draft", "approved", "rejected"];
const STATUS_LABELS = { draft: "Chờ duyệt", approved: "Đã duyệt", rejected: "Từ chối" };
const ACCESS_LABELS = { staff: "Nhân viên", manager: "Quản lý", admin: "Quản trị" };
const VIEWS = {
  notes: { crumb: "Tri thức", title: "Danh sách note", nav: "notes" },
  new: { crumb: "Tri thức", title: "Note mới", nav: "notes" },
  upload: { crumb: "Tri thức", title: "Upload file", nav: "upload" },
  feedback: { crumb: "Chất lượng", title: "Câu trả lời bị báo sai", nav: "feedback" },
  stats: { crumb: "Báo cáo", title: "Thống kê câu hỏi", nav: "stats" },
  directory: { crumb: "Nhân sự", title: "Danh bạ nhân sự", nav: "directory" },
  requests: { crumb: "Nhân sự", title: "Yêu cầu chỉnh sửa", nav: "requests" },
  leaders: { crumb: "Phân quyền", title: "Leader phòng ban", nav: "leaders" },
  report: { crumb: "Tích hợp", title: "Kết nối Major OS", nav: "report" },
  keys: { crumb: "Tích hợp", title: "API nhúng", nav: "keys" },
};
let token = sessionStorage.getItem("admin_token") || "";
let notes = [];
let currentId = null;
let listQuery = "";
let statusFilter = "draft";
let view = "notes";

const $ = (id) => document.getElementById(id);

function headers() { return { "X-Admin-Token": token, "Content-Type": "application/json" }; }

// detail là chuỗi → dùng nguyên văn; mảng/object (422 thô) → câu chung
function detailText(body, status) {
  if (typeof body.detail === "string" && body.detail.trim()) return body.detail;
  return body.detail ? "Dữ liệu chưa hợp lệ" : `Lỗi ${status}`;
}

// Trả về true nếu response là lỗi xác thực đã xử lý (caller phải dừng).
// 401 = token sai; 503 chỉ coi là "chưa cấu hình ADMIN_TOKEN" khi detail đúng nội dung đó,
// 503 khác là lỗi tạm thời: báo lỗi, KHÔNG xoá token.
async function handleAuthFailure(res) {
  if (res.status !== 401 && res.status !== 503) return false;
  if (res.status === 503) {
    const body = await res.clone().json().catch(() => ({}));
    if (typeof body.detail === "string" && body.detail.includes("ADMIN_TOKEN")) {
      sessionStorage.removeItem("admin_token");
      showLogin("Server chưa cấu hình ADMIN_TOKEN.");
    } else {
      toast("Máy chủ tạm thời không phản hồi, vui lòng thử lại sau ít phút.", true);
    }
    return true;
  }
  sessionStorage.removeItem("admin_token");
  showLogin("Token không hợp lệ.");
  return true;
}

async function api(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: headers() });
  if (await handleAuthFailure(res)) throw new Error("unauthorized");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(detailText(body, res.status));
  }
  return res.status === 204 ? null : res.json();
}

async function apiUpload(path, formData) {
  const res = await fetch(API + path, { method: "POST", headers: { "X-Admin-Token": token }, body: formData });
  if (await handleAuthFailure(res)) throw new Error("unauthorized");
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(detailText(body, res.status));
  return body;
}

function toast(message, isError) {
  const item = document.createElement("div");
  item.className = `toast-item ${isError ? "error" : ""}`;
  item.textContent = message;
  $("toast").appendChild(item);
  setTimeout(() => item.remove(), 5000);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function showLogin(message) {
  $("login").hidden = false;
  $("app").hidden = true;
  $("loginError").textContent = message || "";
}

function showApp() {
  $("login").hidden = true;
  $("app").hidden = false;
  fillDepartmentSelects();
  setView("notes");
  loadNotes();
  loadFeedbackCount();
  loadRequestCount();
}

$("loginBtn").onclick = () => {
  const value = $("tokenInput").value.trim();
  if (!value) return;
  token = value;
  sessionStorage.setItem("admin_token", token);
  showApp();
};
$("tokenInput").addEventListener("keydown", (event) => { if (event.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => { sessionStorage.removeItem("admin_token"); token = ""; showLogin(); };

/* ---- điều hướng ---- */
function setView(name) {
  view = name;
  if (name !== "report") freshReportKey = null;  // key vừa tạo chỉ hiện một lần, rời trang là mất
  const meta = VIEWS[name];
  $("crumb").textContent = meta.crumb;
  $("pageTitle").textContent = meta.title;
  $("newNoteBtn").parentElement.hidden = ["new", "directory", "requests"].includes(name);
  if (name !== "directory") closeModal();
  for (const key of Object.keys(VIEWS)) $(`view-${key}`).hidden = key !== name;
  document.querySelectorAll(".nav-item").forEach(btn => btn.classList.toggle("active", btn.dataset.view === meta.nav));
  if (name === "upload") resetUpload();
  if (name === "feedback") renderFeedback();
  if (name === "stats") renderStats();
  if (name === "directory") renderDirectory();
  if (name === "requests") renderRequests();
  if (name === "leaders") renderLeaders();
  if (name === "report") renderReportKeys();
  if (name === "keys") renderApiKeys();
}
document.querySelectorAll(".nav-item").forEach(btn => { btn.onclick = () => setView(btn.dataset.view); });
$("newNoteBtn").onclick = () => { $("newTitle").value = ""; $("newContent").value = ""; $("newDepartment").value = "Unassigned"; setView("new"); };

function departmentOptions(selected) {
  const options = DEPARTMENTS.includes(selected) || !selected ? DEPARTMENTS : [selected, ...DEPARTMENTS];
  return options.map(dep => `<option value="${escapeHtml(dep)}" ${dep === selected ? "selected" : ""}>${escapeHtml(dep)}</option>`).join("");
}
function fillDepartmentSelects() {
  $("newDepartment").innerHTML = departmentOptions("Unassigned");
  $("uploadDepartment").innerHTML = departmentOptions("Unassigned");
}
function optionsFor(values, selected, labels = {}) {
  const options = values.includes(selected) ? values : [selected, ...values];
  return options.map(opt => `<option value="${escapeHtml(opt)}" ${opt === selected ? "selected" : ""}>${escapeHtml(labels[opt] || opt)}</option>`).join("");
}

/* ---- tri thức ---- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    statusFilter = tab.dataset.status;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    loadNotes();
  };
});
$("noteSearch").oninput = (event) => { listQuery = event.target.value.trim().toLocaleLowerCase("vi"); renderList(); };

async function loadDraftCount() {
  try {
    const drafts = statusFilter === "draft" ? notes : await api("/notes?status=draft");
    $("draftCount").textContent = drafts.length;
    $("draftCount").hidden = drafts.length === 0;
  } catch { /* chỉ là số đếm phụ */ }
}

async function loadNotes() {
  try {
    notes = await api(`/notes?status=${statusFilter}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    $("list").innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    return;
  }
  renderList();
  if (!currentId) resetEditor();
  loadDraftCount();
}

function isGapNote(note) { return String(note.title || "").startsWith("[CẦN BỔ SUNG]"); }

function renderList() {
  const list = $("list");
  const visible = notes.filter(note => [note.title, note.department, note.preview].some(value => String(value || "").toLocaleLowerCase("vi").includes(listQuery)));
  $("listSummary").textContent = listQuery ? `${visible.length}/${notes.length} note phù hợp` : `${notes.length} note`;
  if (!notes.length) { list.innerHTML = '<p class="empty">Không có note nào.</p>'; return; }
  if (!visible.length) { list.innerHTML = '<p class="empty">Không tìm thấy note phù hợp.</p>'; return; }
  list.innerHTML = visible.map(note => {
    const gap = isGapNote(note);
    const title = gap ? note.title.replace("[CẦN BỔ SUNG] ", "") : note.title;
    return `
    <div class="note-row ${note.id === currentId ? "active" : ""}" data-id="${escapeHtml(note.id)}">
      <div class="row-top">
        <span class="row-title">${escapeHtml(title)}</span>
        <span class="badge ${escapeHtml(note.status)}">${escapeHtml(STATUS_LABELS[note.status] || note.status)}</span>
      </div>
      <div class="row-meta ${gap ? "gap" : ""}">${gap ? "Câu hỏi chưa có dữ liệu trả lời" : `${escapeHtml(note.department)} · v${escapeHtml(note.version)}`}</div>
      ${note.preview ? `<div class="row-preview">${escapeHtml(note.preview)}</div>` : ""}
    </div>`;
  }).join("");
  list.querySelectorAll(".note-row").forEach(row => { row.onclick = () => openNote(row.dataset.id); });
}

function resetEditor() {
  $("editor").innerHTML = `
    <div class="editor-empty">
      <div class="rule"></div>
      <p>Chọn một note để xem chi tiết</p>
      <p>hoặc tạo note mới, upload file từ thanh bên.</p>
    </div>`;
}

function revealEditorOnMobile() {
  if (!window.matchMedia("(max-width: 1100px)").matches) return;
  requestAnimationFrame(() => $("editorPanel").scrollIntoView({ behavior: "smooth", block: "start" }));
}

async function openNote(id) {
  if (view !== "notes") setView("notes");
  currentId = id;
  renderList();
  $("editor").innerHTML = '<p class="empty">Đang tải nội dung…</p>';
  revealEditorOnMobile();
  let note;
  try {
    note = await api(`/notes/detail?note_id=${encodeURIComponent(id)}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    toast(error.message, true);
    resetEditor();
    return;
  }
  $("editor").innerHTML = `
    <div class="editor-body">
      ${isGapNote(note) ? '<div class="gap-box"><strong>Câu hỏi chưa có dữ liệu.</strong> Nhân viên đã hỏi nhưng trợ lý không tìm thấy tài liệu. Bổ sung nội dung rồi duyệt để trợ lý trả lời được.</div>' : ""}
      ${String(note.source_file || "").startsWith("vault:") ? `<div class="gap-box"><strong>Note này lấy từ wiki Obsidian</strong> (${escapeHtml(note.source_file.slice(6))}). Hãy sửa nội dung trong Obsidian — sửa ở đây sẽ bị ghi đè ở lần wiki đồng bộ tiếp theo.</div>` : ""}
      <div class="grid-2">
        <label class="field full">Tiêu đề<input data-field="title" value="${escapeHtml(note.title)}"></label>
        <label class="field">Phòng ban<select data-field="department">${departmentOptions(note.department)}</select></label>
        <label class="field">Trạng thái<select data-field="status">${optionsFor(STATUSES, note.status, STATUS_LABELS)}</select></label>
        <label class="field">Quyền truy cập<select data-field="access_level">${optionsFor(ACCESS_LEVELS, note.access_level, ACCESS_LABELS)}</select></label>
        <label class="field">Version<input data-field="version" value="${escapeHtml(note.version)}"></label>
      </div>
      <label class="field">Nội dung (Markdown)<textarea id="contentBox">${escapeHtml(note.content)}</textarea></label>
      <div class="actions">
        <button class="btn btn-secondary" id="approveBtn">Duyệt &amp; đồng bộ</button>
        <button class="btn btn-outline" id="saveBtn">Lưu thay đổi</button>
        <button class="btn btn-ghost" id="rejectBtn">Từ chối</button>
        <button class="btn btn-danger" id="deleteBtn">Xoá vĩnh viễn</button>
      </div>
    </div>`;
  $("saveBtn").onclick = () => saveNote(id);
  $("approveBtn").onclick = () => setStatus(id, "approve");
  $("rejectBtn").onclick = () => setStatus(id, "reject");
  $("deleteBtn").onclick = () => deleteNote(id);
}

function collectFields() {
  const fields = {};
  document.querySelectorAll("#editor [data-field]").forEach(input => { fields[input.dataset.field] = input.value; });
  fields.content = $("contentBox").value;
  return fields;
}

async function saveNote(id) {
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(collectFields()) });
    await loadNotes();
    toast("Đã lưu & đồng bộ AI.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function setStatus(id, action) {
  try {
    await api(`/notes/${action}?note_id=${encodeURIComponent(id)}`, { method: "POST" });
    await loadNotes();
    openNote(id);
    toast(action === "approve" ? "Đã duyệt & đồng bộ AI." : "Đã từ chối.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function deleteNote(id) {
  if (!confirm("Xoá vĩnh viễn note này?")) return;
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "DELETE" });
    currentId = null;
    resetEditor();
    await loadNotes();
    toast("Đã xoá.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

/* ---- note mới ---- */
async function createNote(status) {
  const title = $("newTitle").value.trim();
  const department = $("newDepartment").value;
  const content = $("newContent").value.trim();
  if (!title || !content) { toast("Cần nhập tiêu đề và nội dung.", true); return; }
  try {
    const result = await api("/notes/create", { method: "POST", body: JSON.stringify({ title, department, content, status }) });
    toast(status === "approved" ? "Đã tạo, duyệt & đồng bộ AI." : "Đã tạo note nháp.");
    setView("notes");
    await loadNotes();
    openNote(result.id);
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}
$("createDraftBtn").onclick = () => createNote("draft");
$("createApprovedBtn").onclick = () => createNote("approved");

/* ---- upload ---- */
let selectedFile = null;
function setFile(file) {
  selectedFile = file;
  $("uploadSubmitBtn").disabled = !file;
  $("dropZone").classList.toggle("picked", Boolean(file));
  $("dropTitle").textContent = file ? `Đã chọn: ${file.name}` : "Kéo thả file vào đây, hoặc bấm để chọn";
}
function resetUpload() { $("uploadFileInput").value = ""; $("uploadTitle").value = ""; setFile(null); }
$("dropZone").onclick = () => $("uploadFileInput").click();
$("uploadFileInput").onchange = () => setFile($("uploadFileInput").files?.[0] || null);
$("dropZone").ondragover = (event) => { event.preventDefault(); $("dropZone").classList.add("drag"); };
$("dropZone").ondragleave = () => $("dropZone").classList.remove("drag");
$("dropZone").ondrop = (event) => { event.preventDefault(); $("dropZone").classList.remove("drag"); setFile(event.dataTransfer.files?.[0] || null); };
$("uploadSubmitBtn").onclick = async () => {
  if (!selectedFile) return;
  const form = new FormData();
  form.append("file", selectedFile);
  form.append("department", $("uploadDepartment").value);
  const title = $("uploadTitle").value.trim();
  if (title) form.append("title", title);
  $("uploadSubmitBtn").disabled = true;
  try {
    const result = await apiUpload("/upload", form);
    statusFilter = "approved";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.status === "approved"));
    setView("notes");
    await loadNotes();
    if (result.duplicate) {
      toast(`${result.warning} Đã mở sẵn note nghi trùng để bạn kiểm tra.`, true);
      await openNote(result.duplicate.note_id);
    } else {
      toast("Đã upload & duyệt tự động — trợ lý dùng được ngay.");
    }
  } catch (error) {
    $("uploadSubmitBtn").disabled = !selectedFile;
    if (error.message !== "unauthorized") toast(error.message, true);
  }
};

/* ---- báo sai ---- */

        ${item.note ? `<div class="fb-note"><strong>Ghi chú của người báo:</strong> ${escapeHtml(item.note)}</div>` : ""}
        ${(item.citations || []).length ? `<div class="fb-block"><span class="fb-label">Nguồn trợ lý đã dùng</span><div class="fb-sources">${item.citations.map(c => `<button type="button" class="fb-source" data-source="${escapeHtml(c.source)}" title="Mở tài liệu này trong Tri thức"><strong>${escapeHtml(c.source)}</strong>${escapeHtml(c.heading || "")} →</button>`).join("")}</div></div>` : '<p class="muted">Câu trả lời không trích nguồn nào.</p>'}

      </div>

      try {

async function renderStats() {
  const box = $("view-stats");
  box.innerHTML = '<p class="empty">Đang tải thống kê…</p>';
  let data, health = {};
  try {
    [data, health] = await Promise.all([api("/analytics"), fetch("/api/health").then(r => r.json()).catch(() => ({}))]);
  } catch (error) {
    if (error.message !== "unauthorized") box.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    return;
  }
  const groundedRate = data.scanned_logs ? Math.round((data.grounded_count / data.scanned_logs) * 100) : 0;
  const cards = [
    [data.scanned_logs, "Lượt hỏi đã ghi nhận"],
    [`${groundedRate}%`, "Câu trả lời có trích dẫn nguồn"],
    [health.approved_notes ?? "—", "Tài liệu đã duyệt"],
  ];
  box.innerHTML = `
    <div class="stat-cards">${cards.map(([value, label]) => `
      <div class="card stat-card"><div class="rule"></div><div class="value">${escapeHtml(value)}</div><div class="label">${escapeHtml(label)}</div></div>`).join("")}
    </div>
    <div class="stat-lists">
      <section class="card stat-list"><h2>Tài liệu được trích dẫn nhiều nhất</h2>${renderStatRows(data.top_sources, row => row.source)}</section>
      <section class="card stat-list"><h2>Câu hỏi được hỏi nhiều nhất</h2>${renderStatRows(data.top_questions, row => row.question)}</section>
    </div>`;
}

function renderStatRows(rows, getText) {
  if (!rows || !rows.length) return '<p class="muted">Chưa có dữ liệu.</p>';
  const max = Math.max(...rows.map(row => row.count), 1);
  return rows.map((row, index) => `
    <div class="stat-row">
      <span class="rank">${index + 1}</span>
      <div class="mid"><span class="text" title="${escapeHtml(getText(row))}">${escapeHtml(getText(row))}</span><span class="bar"><i style="width: ${Math.round((row.count / max) * 100)}%"></i></span></div>
      <span class="count">${row.count}</span>
    </div>`).join("");
}

async function renderApiKeys() {
  const box = $("view-keys");
  let keys;
  try {
    keys = await api("/api-keys");
  } catch (error) {
    if (error.message !== "unauthorized") box.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    return;
  }
  const endpoint = `${window.location.origin}/api/widget/chat`;
  const rows = keys.map(k => {
    const active = k.status === "active";
    return `
    <section class="card key-card">
      <div class="key-head">
        <div>
          <div class="name"><strong>${escapeHtml(k.label)}</strong><span class="badge ${active ? "active" : "revoked"}">${active ? "Đang hoạt động" : "Đã thu hồi"}</span></div>
          <span class="meta">${escapeHtml(k.allowed_origin)} · tạo ${new Date(k.created_at).toLocaleDateString("vi-VN")}${k.last_used_at ? ` · dùng gần nhất ${new Date(k.last_used_at).toLocaleString("vi-VN")}` : ""}</span>
        </div>
        <div class="btns">
          ${active ? `<button class="btn btn-outline btn-sm" data-revoke="${escapeHtml(k.id)}">Thu hồi</button>` : ""}
          <button class="btn btn-danger btn-sm" data-delete="${escapeHtml(k.id)}">Xoá</button>
        </div>
      </div>
      <div class="key-body">
        <span class="label">API cho giao diện Major OS (khuyến nghị)</span>
        ${snippet("Endpoint", `POST ${endpoint}`)}
        ${snippet("Header", `X-Widget-Key: ${k.key}`)}
        ${snippet("Request body", widgetRequestSnippet())}
        ${snippet("Response thành công", widgetResponseSnippet())}
        <p class="note-box"><strong>Lưu ý:</strong> giữ key ở backend Major OS, không đưa vào frontend.</p>
      </div>
    </section>`;
  }).join("");

  box.innerHTML = `
    <section class="card">
      <h2>Tạo API key</h2>
      <div class="grid-2">
        <label class="field">Tên trang nhúng<input id="newKeyLabel" placeholder="Vd: Intranet phòng HR"></label>
        <label class="field">Domain đối tác<input id="newKeyOrigin" placeholder="https://os.truongvietanh.com" inputmode="url"></label>
      </div>
      <p class="muted">Nhập đúng origin gồm giao thức và domain, không thêm đường dẫn phía sau. Domain này cũng là domain được phép dùng iframe.</p>
      <div><button class="btn btn-secondary" id="createKeyBtn">Tạo API key</button></div>
    </section>
    ${rows || '<p class="muted">Chưa có API key nào.</p>'}`;

  $("createKeyBtn").onclick = async () => {
    const label = $("newKeyLabel").value.trim();
    let allowed_origin = $("newKeyOrigin").value.trim();
    if (!label || !allowed_origin) { toast("Cần nhập tên và domain.", true); return; }
    try {
      const url = new URL(allowed_origin);
      if (!["http:", "https:"].includes(url.protocol) || url.pathname !== "/" && url.pathname !== "" || url.search || url.hash) throw new Error();
      // Lưu đúng origin đã chuẩn hoá (chữ thường, bỏ port mặc định) — backend so khớp
      // tuyệt đối với header Origin của trình duyệt nên không được gửi chuỗi gõ tay.
      allowed_origin = url.origin;
    } catch {
      toast("Domain phải có dạng https://os.truongvietanh.com và không có đường dẫn phía sau.", true);
      return;
    }
    try {
      await api("/api-keys", { method: "POST", body: JSON.stringify({ label, allowed_origin }) });
      toast("Đã tạo API key.");
      await renderApiKeys();
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
  box.querySelectorAll("[data-copy]").forEach(button => { button.onclick = () => copyText(button.dataset.copy); });
  box.querySelectorAll("[data-revoke]").forEach(btn => {
    btn.onclick = async () => {
      try {
        await api(`/api-keys/${btn.dataset.revoke}/revoke`, { method: "POST" });
        toast("Đã thu hồi key.");
        await renderApiKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
  box.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Xoá vĩnh viễn API key này?")) return;
      try {
        await api(`/api-keys/${btn.dataset.delete}`, { method: "DELETE" });
        toast("Đã xoá key.");
        await renderApiKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
}

  const type = col.type === "date" ? "date" : col.type === "email" ? "email" : "text";

/* ---- nhập CSV ---- */
function parseCsv(text) {
  text = text.replace(/^﻿/, "");
  const firstLine = text.split(/\r?\n/, 1)[0] || "";
  let inQ = false, commas = 0, semis = 0;
  for (const ch of firstLine) { if (ch === '"') inQ = !inQ; else if (!inQ) { if (ch === ",") commas++; else if (ch === ";") semis++; } }
  const delim = semis > commas ? ";" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function csvToObjects(text) {
  const grid = parseCsv(text);
  if (grid.length < 2) throw new Error("File không có dòng dữ liệu nào (cần dòng tiêu đề và ít nhất 1 dòng nhân viên).");
  const known = new Set(DIR_COLUMNS.map(c => c.key));
  const header = grid[0].map(h => h.trim().toLowerCase());
  const unknown = header.filter(h => h && !known.has(h));
  if (!header.includes("email")) throw new Error("Dòng đầu tiên phải có cột “email”. Hãy tải file CSV mẫu để xem đúng tên cột.");
  const rows = grid.slice(1).map(r => {
    const obj = {};
    header.forEach((h, i) => { if (known.has(h) && (r[i] ?? "").trim() !== "") obj[h] = r[i].trim(); });
    return obj;
  });
  return { rows, unknown };
}

function downloadCsvSample() {
  const esc = (v) => /[",;\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const keys = DIR_COLUMNS.map(c => c.key);
  const text = "﻿" + keys.join(",") + "\r\n" + keys.map(k => esc(CSV_SAMPLE[k] || "")).join(",") + "\r\n";
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = "mau-danh-ba-nhan-su.csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

async function runImport(dry) {
  const out = $("csvResult");
  out.innerHTML = `<p class="empty">${dry ? "Đang chạy thử…" : "Đang áp dụng…"}</p>`;
  let r;
  try {
    r = await api("/directory/import", { method: "POST", body: JSON.stringify({ rows: importRows, dry_run: dry }) });
  } catch (error) {
    if (error.message !== "unauthorized") out.innerHTML = `<p class="form-err" role="alert">${escapeHtml(error.message)}</p>`;
    return;
  }
  const errs = r.errors || [], prev = r.preview || [];
  const sum = `<div class="dir-sum"><span class="badge approved">Tạo mới: ${escapeHtml(r.created)}</span><span class="badge">Cập nhật: ${escapeHtml(r.updated)}</span><span class="badge off">Không đổi: ${escapeHtml(r.unchanged)}</span><span class="badge ${errs.length ? "err" : "off"}">Lỗi: ${errs.length}</span></div>`;
  if (!dry) {
    out.innerHTML = `<p class="gap-box"><strong>Đã áp dụng.</strong> Tạo mới ${escapeHtml(r.created)}, cập nhật ${escapeHtml(r.updated)}, không đổi ${escapeHtml(r.unchanged)}, bỏ qua ${errs.length} dòng lỗi.</p>`;
    importRows = null; toast("Đã nhập danh bạ."); loadDirectory();
    return;
  }
  const canApply = (r.created + r.updated) > 0;
  out.innerHTML = `
    <p class="muted"><strong>Kết quả chạy thử</strong> (chưa ghi gì vào dữ liệu). Số dòng tính theo dòng dữ liệu, không tính dòng tiêu đề.</p>
    ${sum}
    ${errs.length ? `<ul class="dir-err">${errs.map(e => `<li>Dòng ${escapeHtml(e.row)}${e.email ? ` (${escapeHtml(e.email)})` : ""}: ${escapeHtml(e.message)}</li>`).join("")}</ul>` : ""}
    ${prev.length ? `<div class="dir-table-wrap"><table class="dir-table"><thead><tr><th>Dòng</th><th>Email</th><th>Việc sẽ làm</th><th>Thay đổi</th></tr></thead><tbody>${prev.map(p => `<tr><td>${escapeHtml(p.row)}</td><td>${escapeHtml(p.email)}</td><td><span class="badge ${p.action === "error" ? "err" : p.action === "create" ? "approved" : p.action === "unchanged" ? "off" : ""}">${escapeHtml(IMPORT_ACTIONS[p.action] || p.action)}</span></td><td>${changesHtml(p.changes)}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted">Bảng xem trước hiển thị tối đa 50 dòng.</p>` : ""}
    <div class="actions"><button class="btn btn-secondary" id="csvApply" ${canApply ? "" : "disabled"}>Áp dụng</button>${errs.length && canApply ? '<span class="muted" style="align-self:center">Các dòng lỗi sẽ bị bỏ qua.</span>' : ""}${canApply ? "" : '<span class="muted" style="align-self:center">Không có dòng nào để áp dụng.</span>'}</div>`;
  const apply = $("csvApply");
  if (apply) apply.onclick = async () => { apply.disabled = true; await runImport(false); };
}

/* ---- yêu cầu chỉnh sửa ---- */
const REQUEST_STATUS = { pending: "Đang chờ", approved: "Đã duyệt", rejected: "Đã từ chối", cancelled: "Đã huỷ" };
const REQUEST_FIELDS = { display_name: "Họ tên", job_title: "Chức danh", department: "Phòng ban", campus: "Cơ sở", work_phone: "Điện thoại công việc", employment_start_date: "Ngày vào công ty", team_name: "Tổ chuyên môn", extra_roles: "Kiêm nhiệm", subjects: "Môn dạy", grade_levels: "Khối lớp phụ trách" };
let requestFilter = "pending";

function setRequestCount(count) {
  $("requestCount").textContent = count;
  $("requestCount").hidden = !count;
}
async function loadRequestCount() {
  try { setRequestCount((await api("/change-requests?status=pending")).pending_count); } catch { /* chỉ là số đếm phụ */ }
}

async function renderRequests() {
  const box = $("view-requests");
  if (!box.querySelector("#reqList")) {
    box.innerHTML = `
      <div class="card feedback-tabs"><div class="tabs" role="tablist">
        ${[["pending", "Đang chờ"], ["approved", "Đã duyệt"], ["rejected", "Đã từ chối"], ["cancelled", "Đã huỷ"], ["all", "Tất cả"]].map(([k, l]) => `<button class="tab ${k === requestFilter ? "active" : ""}" data-rstatus="${k}">${l}</button>`).join("")}
      </div></div>
      <div id="reqList" style="display:flex;flex-direction:column;gap:20px"></div>`;
    box.querySelectorAll("[data-rstatus]").forEach(tab => {
      tab.onclick = () => {
        requestFilter = tab.dataset.rstatus;
        box.querySelectorAll("[data-rstatus]").forEach(t => t.classList.toggle("active", t === tab));
        renderRequests();
      };
    });
  }
  const list = $("reqList");
  list.innerHTML = '<p class="empty">Đang tải yêu cầu…</p>';
  let data;
  try {
    data = await api(`/change-requests?status=${requestFilter}`);
  } catch (error) {
    if (error.message !== "unauthorized") list.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    return;
  }
  setRequestCount(data.pending_count);
  if (!data.items.length) {
    list.innerHTML = `<div class="card editor-empty"><div class="rule"></div><p>${requestFilter === "pending" ? "Không có yêu cầu nào đang chờ" : "Không có yêu cầu nào"}</p><p>Nhân viên gửi yêu cầu chỉnh sửa thông tin ở trang Hồ sơ thì sẽ hiện ở đây.</p></div>`;
    return;
  }
  list.innerHTML = data.items.map(r => {
    const pending = r.status === "pending";
    return `
    <section class="card req-card" data-rid="${escapeHtml(r.id)}">
      <div class="fb-head">
        <div class="fb-tags"><strong class="row-title">${escapeHtml(r.display_name || r.email)}</strong><span class="badge ${r.status === "approved" ? "approved" : r.status === "rejected" ? "rejected" : r.status === "cancelled" ? "off" : ""}">${escapeHtml(REQUEST_STATUS[r.status] || r.status)}</span></div>
        <span class="fb-meta">${escapeHtml(r.email)}${r.department ? ` · ${escapeHtml(r.department)}` : ""} · gửi ${escapeHtml(fmtDate(r.created_at))}</span>
      </div>
      <div class="req-body">
        <div><span class="fb-label">${escapeHtml(r.label || REQUEST_FIELDS[r.field] || r.field)}</span>
          <div class="req-change"><span class="old">${escapeHtml(r.old_value || "(trống)")}</span><span class="arrow">→</span><span class="new">${escapeHtml(r.new_value)}</span></div></div>
        ${r.reason ? `<div class="fb-note"><strong>Lý do:</strong> ${escapeHtml(r.reason)}</div>` : ""}
        ${!pending && r.review_note ? `<div class="fb-note"><strong>Ghi chú xử lý:</strong> ${escapeHtml(r.review_note)}${r.reviewed_at ? ` · ${escapeHtml(fmtDate(r.reviewed_at))}` : ""}</div>` : ""}
        <p class="form-err" data-rerr hidden role="alert"></p>
        ${pending ? `<div class="req-act">
          <label class="field">Ghi chú (tuỳ chọn khi duyệt, bắt buộc khi từ chối)<input data-rnote maxlength="500" placeholder="Vd: Đã đối chiếu hợp đồng"></label>
          <button class="btn btn-secondary" data-rapprove>Duyệt</button>
          <button class="btn btn-outline" data-rreject>Từ chối</button>
        </div>` : ""}
      </div>
    </section>`;
  }).join("");
  list.querySelectorAll("[data-rid]").forEach(card => {
    const id = card.dataset.rid;
    const note = card.querySelector("[data-rnote]");
    const err = card.querySelector("[data-rerr]");
    if (!note) return;
    const act = async (kind) => {
      const text = note.value.trim();
      err.hidden = true; note.classList.remove("bad");
      if (kind === "reject" && !text) { note.classList.add("bad"); err.textContent = "Cần nhập lý do khi từ chối."; err.hidden = false; note.focus(); return; }
      card.querySelectorAll("button").forEach(b => { b.disabled = true; });
      try {
        await api(`/change-requests/${encodeURIComponent(id)}/${kind}`, { method: "POST", body: JSON.stringify({ note: text }) });
        toast(kind === "approve" ? "Đã duyệt và áp dụng vào danh bạ." : "Đã từ chối yêu cầu.");
        await renderRequests();
      } catch (error) {
        card.querySelectorAll("button").forEach(b => { b.disabled = false; });
        if (error.message !== "unauthorized") { err.textContent = error.message; err.hidden = false; loadRequestCount(); }
      }
    };
    card.querySelector("[data-rapprove]").onclick = () => act("approve");
    card.querySelector("[data-rreject]").onclick = () => act("reject");
  });
}

      const leader = leaders.find(l => l.email === btn.dataset.edit);
      $("leaderEmail").value = leader.email;
      $("leaderName").value = leader.display_name || "";
      $("leaderActive").checked = leader.active;
      box.querySelectorAll('input[name="leaderDept"]').forEach(i => { i.checked = (leader.departments || []).includes(i.value); });
      $("leaderEmail").scrollIntoView({ behavior: "smooth", block: "center" });
    };
  });
  box.querySelectorAll("[data-remove]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(`Xoá quyền leader của ${btn.dataset.remove}? Các note họ đã sửa vẫn giữ nguyên.`)) return;
      try {
        await api(`/leaders?email=${encodeURIComponent(btn.dataset.remove)}`, { method: "DELETE" });
        toast("Đã xoá leader.");
        await renderLeaders();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
}

/* ---- kết nối Major OS (API báo cáo chỉ-đọc) ---- */
const REPORT_ENDPOINTS = [
  ["kiem-tra", "Thử kết nối — chỉ xác nhận key hợp lệ"],
  ["tinh-nang", "Danh mục tính năng (khoá → tên hiển thị)"],
  ["su-kien", "Nhật ký sử dụng: ai, lúc nào, tính năng nào (lọc tu/den, phân trang con trỏ)"],
  ["gop-y", "Góp ý của người dùng (\"Báo sai\") và trạng thái xử lý"],
  ["canh-bao", "Cảnh báo nghiệp vụ hiện tại"],
  ["tong-quan", "Số liệu tổng hợp: xếp hạng, tính năng ít dùng, tỷ lệ trả lời được"],
];
let freshReportKey = null;

async function downloadReportSpec() {
  try {
    const res = await fetch(`${API}/report-spec`, { headers: headers() });
    if (await handleAuthFailure(res)) return;
    if (!res.ok) throw new Error("Không tải được file mô tả.");
    const url = URL.createObjectURL(await res.blob());
    const link = document.createElement("a");
    link.href = url;
    link.download = "mo-ta-api-bao-cao-tro-ly-noi-bo.md";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (error) {
    toast(error.message, true);
  }
}

async function renderReportKeys() {
  const box = $("view-report");
  let keys;
  try {
    keys = await api("/report-keys");
  } catch (error) {
    if (error.message !== "unauthorized") box.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    return;
  }
  const base = window.location.origin;
  const fresh = freshReportKey ? `
    <section class="card key-card">
      <div class="key-body">
        <span class="label">Key vừa tạo — chỉ hiện MỘT LẦN, hãy dán ngay vào Major OS → Kết nối app</span>
        ${snippet(freshReportKey.label, freshReportKey.key)}
        <p class="note-box"><strong>Lưu ý:</strong> không gửi key qua chat, Zalo hay email. Rời khỏi trang này là không xem lại được; mất key thì tạo key mới và thu hồi key cũ.</p>
      </div>
    </section>` : "";
  const rows = keys.map(k => {
    const active = k.status === "active";
    return `
    <section class="card key-card">
      <div class="key-head">
        <div>
          <div class="name"><strong>${escapeHtml(k.label)}</strong><span class="badge ${active ? "active" : "revoked"}">${active ? "Đang hoạt động" : "Đã thu hồi"}</span></div>
          <span class="meta">vr_…${escapeHtml(k.key_hint)} · tạo ${new Date(k.created_at).toLocaleDateString("vi-VN")}${k.last_used_at ? ` · Major OS gọi gần nhất ${new Date(k.last_used_at).toLocaleString("vi-VN")}` : " · chưa có lần gọi nào"}</span>
        </div>
        <div class="btns">
          ${active ? `<button class="btn btn-outline btn-sm" data-rrevoke="${escapeHtml(k.id)}">Thu hồi</button>` : ""}
          <button class="btn btn-danger btn-sm" data-rdelete="${escapeHtml(k.id)}">Xoá</button>
        </div>
      </div>
    </section>`;
  }).join("");

  box.innerHTML = `
    <section class="card pad">
      <h2>API báo cáo cho Major OS</h2>
      <p class="muted">Major OS đọc báo cáo sử dụng của trợ lý (ai dùng, tính năng nào, góp ý, cảnh báo) qua các địa chỉ dưới đây. Chỉ-đọc, mỗi key gọi tối đa 120 lần/phút, thu hồi key là có hiệu lực ngay.</p>
      <div class="snippet"><span>Danh sách endpoint (HTTPS, GET, header Authorization: Bearer &lt;key&gt;)</span>
        <div class="box"><pre>${REPORT_ENDPOINTS.map(([path, text]) => `${base}/api/report/${path}\n    ${text}`).map(escapeHtml).join("\n")}</pre></div></div>
      <div><button class="btn btn-secondary" id="downloadSpecBtn">Tải file mô tả (.md) để đưa Major OS</button></div>
    </section>
    <section class="card pad">
      <h2>Tạo key cho Major OS</h2>
      <label class="field">Tên key<input id="newReportKeyLabel" placeholder="Vd: Major OS — production" maxlength="100"></label>
      <div><button class="btn btn-secondary" id="createReportKeyBtn">Tạo key</button></div>
    </section>
    ${fresh}
    ${rows || '<p class="muted">Chưa có key nào.</p>'}`;

  $("downloadSpecBtn").onclick = downloadReportSpec;
  $("createReportKeyBtn").onclick = async () => {
    const label = $("newReportKeyLabel").value.trim();
    if (!label) { toast("Cần nhập tên key.", true); return; }
    try {
      freshReportKey = await api("/report-keys", { method: "POST", body: JSON.stringify({ label }) });
      toast("Đã tạo key — copy ngay, sẽ không hiện lại.");
      await renderReportKeys();
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
  box.querySelectorAll("[data-copy]").forEach(button => { button.onclick = () => copyText(button.dataset.copy); });
  box.querySelectorAll("[data-rrevoke]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Thu hồi key này? Major OS sẽ không đọc được báo cáo cho đến khi dùng key mới.")) return;
      try {
        await api(`/report-keys/${btn.dataset.rrevoke}/revoke`, { method: "POST" });
        toast("Đã thu hồi key.");
        await renderReportKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
  box.querySelectorAll("[data-rdelete]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Xoá vĩnh viễn key này?")) return;
      try {
        await api(`/report-keys/${btn.dataset.rdelete}`, { method: "DELETE" });
        toast("Đã xoá key.");
        await renderReportKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
}

if (token) { showApp(); } else { showLogin(); }
</script>
