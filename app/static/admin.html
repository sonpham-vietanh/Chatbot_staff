<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26275D">
<title>Quản trị · Trợ lý nội bộ Trường Việt Anh</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Brand Guideline Trường Việt Anh v2.0 (docs/Brand-Guideline-Viet-Anh-MASTER.docx):
     Navy #26275D chủ đạo, Vàng #F9DD0E chỉ cho CTA (chữ trên nền vàng luôn là Navy),
     nền #F0F4F8, chữ #1A1A2E, viền #E2E8F0; font Be Vietnam Pro, chỉ sans-serif,
     cỡ chữ tối thiểu 16px — không thêm font-size nào nhỏ hơn 16px. */
  :root {
    --navy: #26275D; --navy-dark: #1B1C45; --navy-soft: #E9EAF3;
    --yellow: #F9DD0E; --yellow-dark: #E5C900;
    --surface: #F0F4F8; --panel: #FFFFFF; --ink: #1A1A2E; --muted: #555873; --line: #E2E8F0;
    --danger: #B42318; --success: #1E7A4C;
    --shadow: 0 1px 2px rgba(38,39,93,.06), 0 8px 24px rgba(38,39,93,.06);
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; color: var(--ink); background: var(--surface); font-family: 'Be Vietnam Pro', Arial, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; font-size: 16px; }
  h1, h2, h3 { color: var(--navy); }
  :focus-visible { outline: 3px solid rgba(38,39,93,.35); outline-offset: 2px; }

  /* ---- header ---- */
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand-logo { display: block; width: 170px; height: auto; flex-shrink: 0; }
  .brand-divider { width: 1px; align-self: stretch; background: var(--line); }
  header h1 { font-size: 20px; margin: 0; line-height: 1.2; font-weight: 800; }
  header small { display: block; margin-top: 2px; color: var(--muted); font-size: 16px; font-weight: 500; }
  @media (max-width: 640px) { header { padding: 12px 16px; } .brand-divider, header .brand > div { display: none; } .brand-logo { width: 140px; } }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--navy); color: #fff; border: 1px solid var(--navy); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 700; transition: background .15s, border-color .15s, transform .1s, opacity .15s; }
  .btn:hover { background: var(--navy-dark); border-color: var(--navy-dark); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* CTA chính của trang: nền vàng, chữ Navy (không dùng chữ trắng trên nền vàng). */
  .btn.cta { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
  .btn.cta:hover { background: var(--yellow-dark); border-color: var(--yellow-dark); }
  .btn.secondary { background: var(--panel); color: var(--navy); border-color: var(--line); font-weight: 600; }
  .btn.secondary:hover { background: var(--surface); border-color: rgba(38,39,93,.35); }
  .btn.danger { background: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: #912018; border-color: #912018; }
  .btn.small { padding: 8px 14px; border-radius: 10px; }
  .btn.ghost { background: var(--panel); color: var(--navy); border-color: var(--line); font-weight: 600; }
  .btn.ghost:hover { background: var(--surface); }

  /* ---- login ---- */
  #login { max-width: 440px; margin: 10vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 36px 32px; box-shadow: var(--shadow); }
  #login .brand-logo { width: 230px; margin: 0 auto 22px; }
  #login h2 { margin: 0 0 6px; font-size: 28px; text-align: center; font-weight: 800; }
  #login p { margin: 0 0 22px; text-align: center; color: var(--muted); font-size: 16px; }
  #login input { width: 100%; height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; font-size: 16px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  #login input:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(38,39,93,.12); }
  #login .btn { width: 100%; height: 48px; }
  .error { color: var(--danger); font-size: 16px; min-height: 24px; margin-top: 10px; text-align: center; }

  /* ---- layout ---- */
  main { max-width: 1320px; margin: 0 auto; padding: 24px 22px 60px; display: none; }
  .layout { display: grid; grid-template-columns: 420px minmax(0,1fr); gap: 22px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel-head strong { font-size: 18px; font-weight: 800; color: var(--navy); }
  .panel-head select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; color: var(--ink); }
  .panel-head-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .panel-head-actions .btn { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-search { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .list-search input { width: 100%; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 16px; outline: none; }
  .list-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(38,39,93,.12); }
  .list-summary { padding: 10px 16px 0; color: var(--muted); font-size: 16px; }

  /* ---- note list ---- */
  #list { max-height: 72vh; overflow: auto; }
  .note-row { padding: 14px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
  .note-row:last-child { border-bottom: none; }
  .note-row:hover { background: var(--surface); }
  .note-row.active { background: var(--navy-soft); box-shadow: inset 4px 0 0 var(--navy); }
  .note-row.gap-flag { box-shadow: inset 4px 0 0 var(--yellow); }
  .note-row.gap-flag.active { box-shadow: inset 4px 0 0 var(--navy); }
  .note-row .row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .note-row .title { font-weight: 700; font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-row .meta { color: var(--muted); font-size: 16px; margin-top: 4px; }
  .note-row .preview { color: var(--muted); font-size: 16px; margin-top: 6px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .badge { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 16px; font-weight: 700; line-height: 1.5; background: #FFF6BF; color: #5C4D00; flex-shrink: 0; }
  .badge.approved { background: #DCF2E5; color: #14532D; }
  .badge.rejected { background: #FDE2E0; color: #8A1C14; }
  .badge.unknown { background: var(--navy-soft); color: var(--navy); }

  .empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 16px; }

  /* ---- editor ---- */
  #editor { padding: 22px; }
  #editor label { display: block; font-size: 16px; font-weight: 700; color: var(--navy); margin: 16px 0 6px; }
  #editor label:first-child { margin-top: 0; }
  #editor input, #editor select, #editor textarea {
    width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
    font-size: 16px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #editor input:focus, #editor select:focus, #editor textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(38,39,93,.12); }
  #editor textarea { min-height: 360px; line-height: 1.6; resize: vertical; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 560px) { .meta-grid { grid-template-columns: 1fr; } }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--line); }
  .placeholder { padding: 90px 24px; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.6; }

  /* ---- stats ---- */
  .stats-summary { display: flex; gap: 12px; padding: 22px 22px 0; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .stat-card .value { font-size: 32px; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .stat-card .label { margin-top: 4px; font-size: 16px; color: var(--muted); }
  .stats-section { padding: 22px; }
  .stats-section h3 { margin: 0 0 12px; font-size: 18px; font-weight: 800; }
  .stat-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .rank { flex-shrink: 0; width: 28px; color: var(--muted); font-weight: 700; }
  .stat-row .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-row .count { flex-shrink: 0; background: var(--navy); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 16px; font-weight: 700; }
  .muted-note { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }

  /* ---- toast ---- */
  #toast { position: fixed; top: 18px; right: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .toast-item { background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 16px; box-shadow: var(--shadow); max-width: 380px; animation: toast-in .2s ease both; }
  .toast-item.error { background: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- upload drop zone ---- */
  .drop-zone { border: 2px dashed var(--line); border-radius: 16px; padding: 36px 16px; text-align: center; color: var(--muted); cursor: pointer; font-size: 16px; transition: border-color .15s, background .15s; }
  .drop-zone:hover { border-color: rgba(38,39,93,.35); }
  .drop-zone.drag { border-color: var(--navy); background: var(--navy-soft); color: var(--navy); }
  .drop-zone small { display: block; margin-top: 6px; color: var(--muted); font-size: 16px; }

  /* ---- API nhúng ---- */
  .key-block { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .key-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .key-head strong { font-size: 18px; color: var(--navy); }
  .key-head .badge { margin-left: 8px; }
  .key-actions { display: flex; gap: 8px; }
  .integration-card { margin-top: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .integration-card h3 { margin: 0; font-size: 18px; font-weight: 800; }
  .integration-card p { margin: 8px 0 14px; color: var(--muted); font-size: 16px; line-height: 1.6; }
  .code-row { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  .code-row textarea { flex: 1; min-width: 0; margin: 0 !important; min-height: 48px !important; resize: vertical; }
  .code-row .btn { flex-shrink: 0; align-self: flex-start; }
  .integration-note { margin-top: 12px; padding: 10px 14px; border-left: 4px solid var(--yellow); background: #FFFBE0; color: var(--ink); font-size: 16px; line-height: 1.6; }
  .key-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--muted); font-size: 16px; }
  .key-meta strong { color: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-logo" src="/brand/logo-vietanh.webp" alt="Trường Việt Anh">
    <span class="brand-divider" aria-hidden="true"></span>
    <div>
      <h1>Quản trị tri thức</h1>
      <small>Trợ lý nội bộ · Admin</small>
    </div>
  </div>
  <button class="btn ghost small" id="logoutBtn" style="display:none">Đăng xuất</button>
</header>

<div id="login">
  <img class="brand-logo" src="/brand/logo-vietanh.webp" alt="Trường Việt Anh">
  <h2>Đăng nhập quản trị</h2>
  <p>Nhập admin token để quản lý nội dung tri thức.</p>
  <input id="tokenInput" type="password" placeholder="Admin token" autocomplete="off" aria-label="Admin token">
  <button class="btn cta" id="loginBtn">Vào trang quản trị</button>
  <div class="error" id="loginError"></div>
</div>

<main id="app">
  <div id="toast"></div>
  <div class="layout">
    <div class="panel">
      <div class="panel-head">
        <strong>Danh sách note</strong>
        <select id="statusFilter" aria-label="Lọc theo trạng thái">
          <option value="draft">Chờ duyệt (draft)</option>
          <option value="approved">Đã duyệt</option>
          <option value="rejected">Đã từ chối</option>
          <option value="all">Tất cả</option>
        </select>
      </div>
      <div class="panel-head-actions">
        <button class="btn small cta" id="newNoteBtn">+ Note mới</button>
        <button class="btn small secondary" id="uploadBtn">Upload file</button>
        <button class="btn small secondary" id="statsBtn">Thống kê</button>
        <button class="btn small secondary" id="apiKeysBtn">API nhúng</button>
      </div>
      <div class="list-search"><input id="noteSearch" type="search" placeholder="Tìm tiêu đề, phòng ban..." aria-label="Tìm note theo tiêu đề, phòng ban hoặc nội dung"></div>
      <div class="list-summary" id="listSummary" aria-live="polite"></div>
      <div id="list"></div>
    </div>
    <div class="panel" id="editorPanel">
      <div class="panel-head"><strong id="editorTitle">Chọn một note để xem chi tiết</strong></div>
      <div id="editor"><div class="placeholder">Chọn note bên trái để xem và chỉnh sửa nội dung,<br>hoặc bấm "Note mới" / "Upload file".</div></div>
    </div>
  </div>
</main>

<script>
const API = "/api/admin";
const DEPARTMENTS = ["Unassigned", "HR", "Finance", "Academic", "Admin"];
const ACCESS_LEVELS = ["staff", "manager", "admin"];
const STATUSES = ["draft", "approved", "rejected"];
let token = sessionStorage.getItem("admin_token") || "";
let notes = [];
let currentId = null;
let listQuery = "";

function headers() { return { "X-Admin-Token": token, "Content-Type": "application/json" }; }

async function api(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: headers() });
  if (res.status === 401 || res.status === 503) {
    sessionStorage.removeItem("admin_token");
    showLogin(res.status === 503 ? "Server chưa cấu hình ADMIN_TOKEN." : "Token không hợp lệ.");
    throw new Error("unauthorized");
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Lỗi ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

async function apiUpload(path, formData) {
  const res = await fetch(API + path, { method: "POST", headers: { "X-Admin-Token": token }, body: formData });
  if (res.status === 401 || res.status === 503) {
    sessionStorage.removeItem("admin_token");
    showLogin(res.status === 503 ? "Server chưa cấu hình ADMIN_TOKEN." : "Token không hợp lệ.");
    throw new Error("unauthorized");
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Lỗi ${res.status}`);
  return body;
}

function toast(message, isError) {
  const container = document.getElementById("toast");
  const item = document.createElement("div");
  item.className = `toast-item ${isError ? "error" : ""}`;
  item.textContent = message;
  container.appendChild(item);
  setTimeout(() => item.remove(), 5000);
}

function showLogin(message) {
  document.getElementById("login").style.display = "block";
  document.getElementById("app").style.display = "none";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("loginError").textContent = message || "";
}

function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  loadNotes();
}

document.getElementById("loginBtn").onclick = () => {
  const value = document.getElementById("tokenInput").value.trim();
  if (!value) return;
  token = value;
  sessionStorage.setItem("admin_token", token);
  showApp();
};

document.getElementById("tokenInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter") document.getElementById("loginBtn").click();
});

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("admin_token");
  token = "";
  showLogin();
};

document.getElementById("statusFilter").onchange = loadNotes;
document.getElementById("noteSearch").oninput = (event) => {
  listQuery = event.target.value.trim().toLocaleLowerCase("vi");
  renderList();
};

function revealEditorOnMobile() {
  if (!window.matchMedia("(max-width: 900px)").matches) return;
  requestAnimationFrame(() => document.getElementById("editorPanel").scrollIntoView({ behavior: "smooth", block: "start" }));
}

async function loadNotes() {
  const status = document.getElementById("statusFilter").value;
  try {
    notes = await api(`/notes?status=${status}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    document.getElementById("list").innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
    return;
  }
  renderList();
}

function renderList() {
  const list = document.getElementById("list");
  const visibleNotes = notes.filter(note => [note.title, note.department, note.preview].some(value => String(value || "").toLocaleLowerCase("vi").includes(listQuery)));
  document.getElementById("listSummary").textContent = listQuery ? `${visibleNotes.length}/${notes.length} note phù hợp` : `${notes.length} note`;
  if (!notes.length) {
    list.innerHTML = '<div class="empty">Không có note nào.</div>';
    return;
  }
  if (!visibleNotes.length) {
    list.innerHTML = '<div class="empty">Không tìm thấy note phù hợp. Thử từ khóa khác.</div>';
    return;
  }
  list.innerHTML = visibleNotes.map(note => {
    const isGap = note.title.startsWith("[CẦN BỔ SUNG]");
    const title = isGap ? note.title.replace("[CẦN BỔ SUNG] ", "") : note.title;
    return `
    <div class="note-row ${note.id === currentId ? 'active' : ''} ${isGap ? 'gap-flag' : ''}" data-id="${note.id}">
      <div class="row-top">
        <div class="title">${isGap ? '❓ ' : ''}${escapeHtml(title)}</div>
        <span class="badge ${note.status}">${note.status}</span>
      </div>
      <div class="meta">${isGap ? 'Câu hỏi chưa có dữ liệu trả lời' : `${escapeHtml(note.department)} · v${escapeHtml(note.version)}`}</div>
      <div class="preview">${escapeHtml(note.preview)}</div>
    </div>
  `;
  }).join("");
  list.querySelectorAll(".note-row").forEach(row => {
    row.onclick = () => openNote(row.dataset.id);
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function openNote(id) {
  currentId = id;
  renderList();
  document.getElementById("editorTitle").textContent = "Đang tải note...";
  document.getElementById("editor").innerHTML = '<div class="placeholder">Đang tải nội dung...</div>';
  revealEditorOnMobile();
  let note;
  try {
    note = await api(`/notes/detail?note_id=${encodeURIComponent(id)}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    alert(error.message);
    return;
  }
  document.getElementById("editorTitle").textContent = note.title || id;
  document.getElementById("editor").innerHTML = `
    <div class="meta-grid">
      <label>Tiêu đề</label><input data-field="title" value="${escapeHtml(note.title)}">
      <label>Phòng ban</label><select data-field="department">${departmentOptions(note.department)}</select>
      <label>Trạng thái</label><select data-field="status">${optionsFor(STATUSES, note.status)}</select>
      <label>Version</label><input data-field="version" value="${escapeHtml(note.version)}">
      <label>Quyền truy cập</label><select data-field="access_level">${optionsFor(ACCESS_LEVELS, note.access_level)}</select>
    </div>
    <label>Nội dung</label>
    <textarea id="contentBox">${escapeHtml(note.content)}</textarea>
    <div class="actions">
      <button class="btn" id="saveBtn">Lưu thay đổi</button>
      <button class="btn" id="approveBtn">Duyệt (approved)</button>
      <button class="btn secondary" id="rejectBtn">Từ chối</button>
      <button class="btn danger" id="deleteBtn">Xoá vĩnh viễn</button>
    </div>
  `;
  document.getElementById("saveBtn").onclick = () => saveNote(id);
  document.getElementById("approveBtn").onclick = () => setStatus(id, "approve");
  document.getElementById("rejectBtn").onclick = () => setStatus(id, "reject");
  document.getElementById("deleteBtn").onclick = () => deleteNote(id);
}

function optionsFor(values, selected) {
  const options = values.includes(selected) ? values : [selected, ...values];
  return options.map(opt => `<option value="${escapeHtml(opt)}" ${opt === selected ? "selected" : ""}>${escapeHtml(opt)}</option>`).join("");
}

function collectFields() {
  const fields = {};
  document.querySelectorAll("[data-field]").forEach(input => {
    fields[input.dataset.field] = input.value;
  });
  fields.content = document.getElementById("contentBox").value;
  return fields;
}

async function saveNote(id) {
  const body = collectFields();
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(body) });
    await loadNotes();
    toast("Đã lưu & đồng bộ AI.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function setStatus(id, action) {
  try {
    await api(`/notes/${action}?note_id=${encodeURIComponent(id)}`, { method: "POST" });
    await loadNotes();
    openNote(id);
    toast(action === "approve" ? "Đã duyệt & đồng bộ AI." : "Đã từ chối.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function deleteNote(id) {
  if (!confirm("Xoá vĩnh viễn note này?")) return;
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "DELETE" });
    currentId = null;
    resetEditor();
    await loadNotes();
    toast("Đã xoá.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

function resetEditor() {
  document.getElementById("editor").innerHTML = '<div class="placeholder">Chọn note bên trái để xem và chỉnh sửa nội dung,<br>hoặc bấm "Tạo note mới" / "Upload file".</div>';
  document.getElementById("editorTitle").textContent = "Chọn một note để xem chi tiết";
}

function departmentOptions(selected) {
  return DEPARTMENTS.map(dep => `<option value="${dep}" ${dep === selected ? "selected" : ""}>${dep}</option>`).join("");
}

function showNewNoteForm() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Tạo note mới";
  document.getElementById("editor").innerHTML = `
    <label>Tiêu đề</label>
    <input id="newTitle" placeholder="Vd: Quy định nghỉ phép 2026">
    <label>Phòng ban</label>
    <select id="newDepartment">${departmentOptions("Unassigned")}</select>
    <label>Nội dung (Markdown)</label>
    <textarea id="newContent" placeholder="Nhập nội dung quy định..."></textarea>
    <div class="actions">
      <button class="btn" id="createDraftBtn">Lưu nháp (draft)</button>
      <button class="btn secondary" id="createApprovedBtn">Lưu & Duyệt luôn</button>
    </div>
  `;
  revealEditorOnMobile();
  document.getElementById("createDraftBtn").onclick = () => createNote("draft");
  document.getElementById("createApprovedBtn").onclick = () => createNote("approved");
}

async function createNote(status) {
  const title = document.getElementById("newTitle").value.trim();
  const department = document.getElementById("newDepartment").value;
  const content = document.getElementById("newContent").value.trim();
  if (!title || !content) { toast("Cần nhập tiêu đề và nội dung.", true); return; }
  try {
    const result = await api("/notes/create", {
      method: "POST",
      body: JSON.stringify({ title, department, content, status }),
    });
    await loadNotes();
    toast(status === "approved" ? "Đã tạo, duyệt & đồng bộ AI." : "Đã tạo note nháp.");
    openNote(result.id);
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

function showUploadForm() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Upload file";
  document.getElementById("editor").innerHTML = `
    <label>Phòng ban</label>
    <select id="uploadDepartment">${departmentOptions("Unassigned")}</select>
    <label>Tiêu đề (tuỳ chọn)</label>
    <input id="uploadTitle" placeholder="Để trống sẽ lấy theo tên file">
    <label>File</label>
    <div class="drop-zone" id="dropZone">Kéo thả file vào đây, hoặc bấm để chọn<br><small>.md .txt .csv .json .pdf .docx — tối đa 10MB</small></div>
    <input type="file" id="uploadFileInput" style="display:none" accept=".md,.txt,.csv,.json,.pdf,.docx">
    <p class="muted-note" style="margin-top:14px">File sẽ được duyệt tự động và chatbot dùng được ngay — kiểm tra lại nội dung trong danh sách note nếu cần chỉnh sửa.</p>
    <div class="actions"><button class="btn" id="uploadSubmitBtn" disabled>Upload & duyệt tự động</button></div>
  `;
  revealEditorOnMobile();
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("uploadFileInput");
  const submitBtn = document.getElementById("uploadSubmitBtn");
  let selectedFile = null;
  const setFile = (file) => {
    selectedFile = file;
    submitBtn.disabled = !file;
    dropZone.innerHTML = file ? `Đã chọn: <strong>${escapeHtml(file.name)}</strong>` : 'Kéo thả file vào đây, hoặc bấm để chọn<br><small>.md .txt .csv .json .pdf .docx — tối đa 10MB</small>';
  };
  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = () => setFile(fileInput.files?.[0] || null);
  dropZone.ondragover = (event) => { event.preventDefault(); dropZone.classList.add("drag"); };
  dropZone.ondragleave = () => dropZone.classList.remove("drag");
  dropZone.ondrop = (event) => {
    event.preventDefault();
    dropZone.classList.remove("drag");
    setFile(event.dataTransfer.files?.[0] || null);
  };
  submitBtn.onclick = async () => {
    if (!selectedFile) return;
    const form = new FormData();
    form.append("file", selectedFile);
    form.append("department", document.getElementById("uploadDepartment").value);
    const title = document.getElementById("uploadTitle").value.trim();
    if (title) form.append("title", title);
    try {
      const result = await apiUpload("/upload", form);
      document.getElementById("statusFilter").value = "approved";
      await loadNotes();
      if (result.duplicate) {
        toast(`${result.warning} Đã mở sẵn note nghi trùng để bạn kiểm tra.`, true);
        await openNote(result.duplicate.note_id);
      } else {
        resetEditor();
        toast("Đã upload & duyệt tự động — chatbot dùng được ngay. Kiểm tra lại trong danh sách nếu cần.");
      }
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
}

async function showStats() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Thống kê câu hỏi";
  document.getElementById("editor").innerHTML = '<div class="placeholder">Đang tải thống kê...</div>';
  revealEditorOnMobile();
  let data;
  try {
    data = await api("/analytics");
  } catch (error) {
    if (error.message !== "unauthorized") {
      document.getElementById("editor").innerHTML = `<div class="placeholder">${escapeHtml(error.message)}</div>`;
    }
    return;
  }
  const groundedRate = data.scanned_logs ? Math.round((data.grounded_count / data.scanned_logs) * 100) : 0;
  document.getElementById("editor").innerHTML = `
    <div class="stats-summary">
      <div class="stat-card"><div class="value">${data.scanned_logs}</div><div class="label">Lượt hỏi đã ghi nhận</div></div>
      <div class="stat-card"><div class="value">${groundedRate}%</div><div class="label">Có trích dẫn nguồn</div></div>
    </div>
    <div class="stats-section">
      <h3>Tài liệu được trích dẫn nhiều nhất</h3>
      ${renderStatRows(data.top_sources, (row) => row.source)}
    </div>
    <div class="stats-section" style="padding-top:0">
      <h3>Câu hỏi giống nhau được hỏi nhiều nhất</h3>
      ${renderStatRows(data.top_questions, (row) => row.question)}
    </div>
  `;
}

function renderStatRows(rows, getText) {
  if (!rows || !rows.length) return '<p class="muted-note">Chưa có dữ liệu.</p>';
  return rows.map((row, index) => `
    <div class="stat-row">
      <span class="rank">${index + 1}</span>
      <span class="text" title="${escapeHtml(getText(row))}">${escapeHtml(getText(row))}</span>
      <span class="count">${row.count}</span>
    </div>
  `).join("");
}

function embedSnippet(key) {
  const src = `${window.location.origin}/?embed_key=${key}`;
  return `<iframe src="${src}" style="width:100%;height:640px;border:0;border-radius:12px;" title="Viet Anh Staff Assistant" allow="clipboard-write"></iframe>`;
}

function widgetApiSnippet(key) {
  return `POST ${window.location.origin}/api/widget/chat
X-Widget-Key: ${key}
Content-Type: application/json

{"question":"Tôi cần xin nghỉ phép trước bao lâu?","history":[]}`;
}

function widgetResponseSnippet() {
  return `{
  "answer": "...",
  "grounded": true,
  "citations": [{"source": "Tên tài liệu", "heading": "Mục trong tài liệu", "version": "0.1"}],
  "thread_id": null
}`;
}

function widgetRequestSnippet() {
  return `{
  "question": "Nội dung người dùng hỏi",
  "history": []
}`;
}

function copyText(value, message = "Đã copy") {
  navigator.clipboard?.writeText(value).then(() => toast(message)).catch(() => toast("Không thể copy tự động, hãy bôi đen và copy.", true));
}

function copyButton(value, label = "Copy") {
  return `<button class="btn secondary small" type="button" data-copy="${escapeHtml(value)}">${label}</button>`;
}

async function showApiKeys() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "API nhúng cho trang nội bộ khác";
  document.getElementById("editor").innerHTML = '<div class="placeholder">Đang tải danh sách key...</div>';
  revealEditorOnMobile();
  await renderApiKeys();
}

async function renderApiKeys() {
  let keys;
  try {
    keys = await api("/api-keys");
  } catch (error) {
    if (error.message !== "unauthorized") {
      document.getElementById("editor").innerHTML = `<div class="placeholder">${escapeHtml(error.message)}</div>`;
    }
    return;
  }
  const rows = keys.map((k) => `
    <div class="key-block">
      <div class="key-head">
        <div>
          <strong>${escapeHtml(k.label)}</strong>
          <span class="badge ${k.status === 'active' ? 'approved' : 'rejected'}">${k.status}</span>
        </div>
        <div class="key-actions">
          ${k.status === 'active' ? `<button class="btn secondary small" data-revoke="${k.id}">Thu hồi</button>` : ""}
          <button class="btn danger small" data-delete="${k.id}">Xoá</button>
        </div>
      </div>
      <div class="key-meta"><span>Domain: <strong>${escapeHtml(k.allowed_origin)}</strong></span><span>Tạo: ${new Date(k.created_at).toLocaleString('vi-VN')}</span>${k.last_used_at ? `<span>Dùng gần nhất: ${new Date(k.last_used_at).toLocaleString('vi-VN')}</span>` : ''}</div>
      <div class="integration-card">
        <h3>API cho giao diện Major OS (khuyến nghị)</h3>
        <label>Endpoint</label>
        <div class="code-row"><textarea readonly rows="1">${escapeHtml(`${window.location.origin}/api/widget/chat`)}</textarea>${copyButton(`${window.location.origin}/api/widget/chat`)}</div>
        <label>Method</label>
        <div class="code-row"><textarea readonly rows="1">POST</textarea>${copyButton("POST")}</div>
        <label>Header</label>
        <div class="code-row"><textarea readonly rows="1">X-Widget-Key: ${escapeHtml(k.key)}</textarea>${copyButton(`X-Widget-Key: ${k.key}`)}</div>
        <label>Request body</label>
        <div class="code-row"><textarea readonly rows="4">${escapeHtml(widgetRequestSnippet())}</textarea>${copyButton(widgetRequestSnippet())}</div>
        <label>Response thành công</label>
        <div class="code-row"><textarea readonly rows="6">${escapeHtml(widgetResponseSnippet())}</textarea>${copyButton(widgetResponseSnippet())}</div>
        <div class="integration-note">Giữ key ở backend Major OS, không đưa vào frontend.</div>
      </div>
    </div>
  `).join("") || '<p class="muted-note">Chưa có API key nào.</p>';

  document.getElementById("editor").innerHTML = `
    <label>Tên trang nhúng</label>
    <input id="newKeyLabel" placeholder="Vd: Intranet phòng HR">
    <label>Domain của giao diện đối tác (vd https://os.truongvietanh.com)</label>
    <input id="newKeyOrigin" placeholder="https://os.truongvietanh.com" inputmode="url">
    <p class="muted-note" style="margin-top:8px">Nhập đúng origin gồm giao thức và domain, không thêm đường dẫn phía sau. Key dùng cho API backend; domain này cũng là domain được phép dùng iframe.</p>
    <div class="actions"><button class="btn" id="createKeyBtn">Tạo API key</button></div>
    <div style="margin-top:22px">${rows}</div>
  `;

  document.getElementById("createKeyBtn").onclick = async () => {
    const label = document.getElementById("newKeyLabel").value.trim();
    let allowed_origin = document.getElementById("newKeyOrigin").value.trim();
    if (!label || !allowed_origin) { toast("Cần nhập tên và domain.", true); return; }
    try {
      const url = new URL(allowed_origin);
      if (!['http:', 'https:'].includes(url.protocol) || url.pathname !== '/' && url.pathname !== '' || url.search || url.hash) throw new Error();
      // Lưu đúng origin đã chuẩn hoá (chữ thường, bỏ port mặc định) — backend so khớp
      // tuyệt đối với header Origin của trình duyệt nên không được gửi chuỗi gõ tay.
      allowed_origin = url.origin;
      document.getElementById("newKeyOrigin").value = allowed_origin;
    } catch {
      toast("Domain phải có dạng https://os.truongvietanh.com và không có đường dẫn phía sau.", true);
      return;
    }
    try {
      await api("/api-keys", { method: "POST", body: JSON.stringify({ label, allowed_origin }) });
      toast("Đã tạo API key.");
      await renderApiKeys();
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
  document.querySelectorAll("[data-copy]").forEach((button) => {
    button.onclick = () => copyText(button.dataset.copy);
  });
  document.querySelectorAll("[data-revoke]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        await api(`/api-keys/${btn.dataset.revoke}/revoke`, { method: "POST" });
        toast("Đã thu hồi key.");
        await renderApiKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
  document.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm("Xoá vĩnh viễn API key này?")) return;
      try {
        await api(`/api-keys/${btn.dataset.delete}`, { method: "DELETE" });
        toast("Đã xoá key.");
        await renderApiKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
}

document.getElementById("newNoteBtn").onclick = showNewNoteForm;
document.getElementById("uploadBtn").onclick = showUploadForm;
document.getElementById("statsBtn").onclick = showStats;
document.getElementById("apiKeysBtn").onclick = showApiKeys;

if (token) { showApp(); } else { showLogin(); }
</script>
</body>
</html>
