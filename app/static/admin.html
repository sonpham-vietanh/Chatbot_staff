<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viet Anh Staff Assistant — Admin</title>
<style>
  :root {
    --ink: #12212b; --muted: #6f7e84; --paper: #f4f1e8; --panel: #fffdf7;
    --line: #d9ddd4; --teal: #126d6a; --teal-dark: #0c4d4b; --yellow: #f4c95d;
    --coral: #e9785b; --shadow: 0 18px 50px rgba(27,43,43,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, sans-serif; }
  button, input, select, textarea { font: inherit; }
  header { background: var(--teal-dark); color: #f7f3e9; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header small { color: #b9d4cb; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px; display: none; }
  #login { max-width: 380px; margin: 80px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow); }
  #login h2 { margin-top: 0; font-size: 18px; }
  #login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
  #login button, .btn { background: var(--teal); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #login button:hover, .btn:hover { background: var(--teal-dark); }
  .btn.secondary { background: transparent; color: var(--teal-dark); border: 1px solid var(--line); }
  .btn.danger { background: var(--coral); }
  .error { color: var(--coral); font-size: 13px; min-height: 18px; }
  .layout { display: grid; grid-template-columns: 380px minmax(0,1fr); gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel-head select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; }
  #list { max-height: 74vh; overflow: auto; }
  .note-row { padding: 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .note-row:hover { background: rgba(18,109,106,.06); }
  .note-row.active { background: rgba(18,109,106,.12); }
  .note-row .title { font-weight: 600; font-size: 14px; }
  .note-row .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .note-row .preview { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; background: #e8e2cf; color: #6b5c1f; }
  .badge.approved { background: #dcefe2; color: #276a44; }
  .badge.rejected { background: #f6dede; color: #9a2f2f; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  #editor { padding: 18px; }
  #editor label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #editor input, #editor textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #editor textarea { min-height: 320px; font-family: 'Courier New', monospace; font-size: 13px; resize: vertical; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .placeholder { padding: 60px 20px; text-align: center; color: var(--muted); }
  .panel-head-actions { display: flex; gap: 8px; }
  .btn.small { padding: 6px 10px; font-size: 12px; }
  #toast { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .toast-item { background: var(--teal-dark); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 12px; box-shadow: var(--shadow); max-width: 320px; }
  .toast-item.error { background: var(--coral); }
  #editor select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .drop-zone { border: 2px dashed var(--line); border-radius: 10px; padding: 30px 16px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop-zone.drag { border-color: var(--teal); background: rgba(18,109,106,.06); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Viet Anh Staff Assistant</h1>
    <small>Admin — duyệt nội dung (Supabase)</small>
  </div>
  <button class="btn secondary" id="logoutBtn" style="display:none">Đăng xuất</button>
</header>

<div id="login">
  <h2>Đăng nhập Admin</h2>
  <input id="tokenInput" type="password" placeholder="Admin token" autocomplete="off">
  <button id="loginBtn">Vào trang quản trị</button>
  <div class="error" id="loginError"></div>
</div>

<main id="app">
  <div id="toast"></div>
  <div class="layout">
    <div class="panel">
      <div class="panel-head">
        <strong>Danh sách note</strong>
        <select id="statusFilter">
          <option value="draft">Chờ duyệt (draft)</option>
          <option value="approved">Đã duyệt</option>
          <option value="rejected">Đã từ chối</option>
          <option value="all">Tất cả</option>
        </select>
      </div>
      <div class="panel-head panel-head-actions" style="border-top:1px solid var(--line)">
        <button class="btn small" id="newNoteBtn">+ Tạo note mới</button>
        <button class="btn small secondary" id="uploadBtn">Upload file</button>
      </div>
      <div id="list"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><strong id="editorTitle">Chọn một note để xem chi tiết</strong></div>
      <div id="editor"><div class="placeholder">Chọn note bên trái để xem và chỉnh sửa nội dung, hoặc bấm "Tạo note mới" / "Upload file".</div></div>
    </div>
  </div>
</main>

<script>
const API = "/api/admin";
const DEPARTMENTS = ["Unassigned", "HR", "Finance", "Academic", "Admin"];
const ACCESS_LEVELS = ["staff", "manager", "admin"];
const STATUSES = ["draft", "approved", "rejected"];
let token = sessionStorage.getItem("admin_token") || "";
let notes = [];
let currentId = null;

function headers() { return { "X-Admin-Token": token, "Content-Type": "application/json" }; }

async function api(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: headers() });
  if (res.status === 401 || res.status === 503) {
    sessionStorage.removeItem("admin_token");
    showLogin(res.status === 503 ? "Server chưa cấu hình ADMIN_TOKEN." : "Token không hợp lệ.");
    throw new Error("unauthorized");
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Lỗi ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

async function apiUpload(path, formData) {
  const res = await fetch(API + path, { method: "POST", headers: { "X-Admin-Token": token }, body: formData });
  if (res.status === 401 || res.status === 503) {
    sessionStorage.removeItem("admin_token");
    showLogin(res.status === 503 ? "Server chưa cấu hình ADMIN_TOKEN." : "Token không hợp lệ.");
    throw new Error("unauthorized");
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Lỗi ${res.status}`);
  return body;
}

function toast(message, isError) {
  const container = document.getElementById("toast");
  const item = document.createElement("div");
  item.className = `toast-item ${isError ? "error" : ""}`;
  item.textContent = message;
  container.appendChild(item);
  setTimeout(() => item.remove(), 5000);
}

function showLogin(message) {
  document.getElementById("login").style.display = "block";
  document.getElementById("app").style.display = "none";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("loginError").textContent = message || "";
}

function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  loadNotes();
}

document.getElementById("loginBtn").onclick = () => {
  const value = document.getElementById("tokenInput").value.trim();
  if (!value) return;
  token = value;
  sessionStorage.setItem("admin_token", token);
  showApp();
};

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("admin_token");
  token = "";
  showLogin();
};

document.getElementById("statusFilter").onchange = loadNotes;

async function loadNotes() {
  const status = document.getElementById("statusFilter").value;
  try {
    notes = await api(`/notes?status=${status}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    document.getElementById("list").innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }
  renderList();
}

function renderList() {
  const list = document.getElementById("list");
  if (!notes.length) {
    list.innerHTML = '<div class="empty">Không có note nào.</div>';
    return;
  }
  list.innerHTML = notes.map(note => `
    <div class="note-row ${note.id === currentId ? 'active' : ''}" data-id="${note.id}">
      <div class="title">${escapeHtml(note.title)} <span class="badge ${note.status}">${note.status}</span></div>
      <div class="meta">${escapeHtml(note.department)} · v${escapeHtml(note.version)}</div>
      <div class="preview">${escapeHtml(note.preview)}</div>
    </div>
  `).join("");
  list.querySelectorAll(".note-row").forEach(row => {
    row.onclick = () => openNote(row.dataset.id);
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function openNote(id) {
  currentId = id;
  renderList();
  let note;
  try {
    note = await api(`/notes/detail?note_id=${encodeURIComponent(id)}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    alert(error.message);
    return;
  }
  document.getElementById("editorTitle").textContent = note.title || id;
  document.getElementById("editor").innerHTML = `
    <div class="meta-grid">
      <label>title</label><input data-field="title" value="${escapeHtml(note.title)}">
      <label>department</label><select data-field="department">${departmentOptions(note.department)}</select>
      <label>status</label><select data-field="status">${optionsFor(STATUSES, note.status)}</select>
      <label>version</label><input data-field="version" value="${escapeHtml(note.version)}">
      <label>access_level</label><select data-field="access_level">${optionsFor(ACCESS_LEVELS, note.access_level)}</select>
    </div>
    <label>Nội dung</label>
    <textarea id="contentBox">${escapeHtml(note.content)}</textarea>
    <div class="actions">
      <button class="btn" id="saveBtn">Lưu thay đổi</button>
      <button class="btn" id="approveBtn">Duyệt (approved)</button>
      <button class="btn secondary" id="rejectBtn">Từ chối</button>
      <button class="btn danger" id="deleteBtn">Xoá vĩnh viễn</button>
    </div>
  `;
  document.getElementById("saveBtn").onclick = () => saveNote(id);
  document.getElementById("approveBtn").onclick = () => setStatus(id, "approve");
  document.getElementById("rejectBtn").onclick = () => setStatus(id, "reject");
  document.getElementById("deleteBtn").onclick = () => deleteNote(id);
}

function optionsFor(values, selected) {
  const options = values.includes(selected) ? values : [selected, ...values];
  return options.map(opt => `<option value="${escapeHtml(opt)}" ${opt === selected ? "selected" : ""}>${escapeHtml(opt)}</option>`).join("");
}

function collectFields() {
  const fields = {};
  document.querySelectorAll("[data-field]").forEach(input => {
    fields[input.dataset.field] = input.value;
  });
  fields.content = document.getElementById("contentBox").value;
  return fields;
}

async function saveNote(id) {
  const body = collectFields();
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(body) });
    await loadNotes();
    toast("Đã lưu & đồng bộ AI.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function setStatus(id, action) {
  try {
    await api(`/notes/${action}?note_id=${encodeURIComponent(id)}`, { method: "POST" });
    await loadNotes();
    openNote(id);
    toast(action === "approve" ? "Đã duyệt & đồng bộ AI." : "Đã từ chối.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function deleteNote(id) {
  if (!confirm("Xoá vĩnh viễn note này?")) return;
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "DELETE" });
    currentId = null;
    resetEditor();
    await loadNotes();
    toast("Đã xoá.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

function resetEditor() {
  document.getElementById("editor").innerHTML = '<div class="placeholder">Chọn note bên trái để xem và chỉnh sửa nội dung, hoặc bấm "Tạo note mới" / "Upload file".</div>';
  document.getElementById("editorTitle").textContent = "Chọn một note để xem chi tiết";
}

function departmentOptions(selected) {
  return DEPARTMENTS.map(dep => `<option value="${dep}" ${dep === selected ? "selected" : ""}>${dep}</option>`).join("");
}

function showNewNoteForm() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Tạo note mới";
  document.getElementById("editor").innerHTML = `
    <label>Tiêu đề</label>
    <input id="newTitle" placeholder="Vd: Quy định nghỉ phép 2026">
    <label>Phòng ban</label>
    <select id="newDepartment">${departmentOptions("Unassigned")}</select>
    <label>Nội dung (Markdown)</label>
    <textarea id="newContent" placeholder="Nhập nội dung quy định..."></textarea>
    <div class="actions">
      <button class="btn" id="createDraftBtn">Lưu nháp (draft)</button>
      <button class="btn" id="createApprovedBtn">Lưu & Duyệt luôn</button>
    </div>
  `;
  document.getElementById("createDraftBtn").onclick = () => createNote("draft");
  document.getElementById("createApprovedBtn").onclick = () => createNote("approved");
}

async function createNote(status) {
  const title = document.getElementById("newTitle").value.trim();
  const department = document.getElementById("newDepartment").value;
  const content = document.getElementById("newContent").value.trim();
  if (!title || !content) { toast("Cần nhập tiêu đề và nội dung.", true); return; }
  try {
    const result = await api("/notes/create", {
      method: "POST",
      body: JSON.stringify({ title, department, content, status }),
    });
    await loadNotes();
    toast(status === "approved" ? "Đã tạo, duyệt & đồng bộ AI." : "Đã tạo note nháp.");
    openNote(result.id);
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

function showUploadForm() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Upload file";
  document.getElementById("editor").innerHTML = `
    <label>Phòng ban</label>
    <select id="uploadDepartment">${departmentOptions("Unassigned")}</select>
    <label>Tiêu đề (tuỳ chọn)</label>
    <input id="uploadTitle" placeholder="Để trống sẽ lấy theo tên file">
    <label>File</label>
    <div class="drop-zone" id="dropZone">Kéo thả file vào đây, hoặc bấm để chọn<br><small>.md .txt .csv .json .pdf .docx — tối đa 10MB</small></div>
    <input type="file" id="uploadFileInput" class="hidden" style="display:none" accept=".md,.txt,.csv,.json,.pdf,.docx">
    <div class="actions"><button class="btn" id="uploadSubmitBtn" disabled>Upload → tạo draft</button></div>
  `;
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("uploadFileInput");
  const submitBtn = document.getElementById("uploadSubmitBtn");
  let selectedFile = null;
  const setFile = (file) => {
    selectedFile = file;
    submitBtn.disabled = !file;
    dropZone.textContent = file ? `Đã chọn: ${file.name}` : "Kéo thả file vào đây, hoặc bấm để chọn";
  };
  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = () => setFile(fileInput.files?.[0] || null);
  dropZone.ondragover = (event) => { event.preventDefault(); dropZone.classList.add("drag"); };
  dropZone.ondragleave = () => dropZone.classList.remove("drag");
  dropZone.ondrop = (event) => {
    event.preventDefault();
    dropZone.classList.remove("drag");
    setFile(event.dataTransfer.files?.[0] || null);
  };
  submitBtn.onclick = async () => {
    if (!selectedFile) return;
    const form = new FormData();
    form.append("file", selectedFile);
    form.append("department", document.getElementById("uploadDepartment").value);
    const title = document.getElementById("uploadTitle").value.trim();
    if (title) form.append("title", title);
    try {
      await apiUpload("/upload", form);
      document.getElementById("statusFilter").value = "draft";
      await loadNotes();
      resetEditor();
      toast("Đã upload, tạo draft chờ duyệt — chọn note trong danh sách để xem/duyệt.");
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
}

document.getElementById("newNoteBtn").onclick = showNewNoteForm;
document.getElementById("uploadBtn").onclick = showUploadForm;

if (token) { showApp(); } else { showLogin(); }
</script>
</body>
</html>
