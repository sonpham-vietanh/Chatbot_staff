<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viet Anh Staff Assistant — Admin</title>
<style>
  :root {
    --ink: #12212b; --muted: #6f7e84; --paper: #f4f1e8; --panel: #fffdf7;
    --line: #d9ddd4; --teal: #126d6a; --teal-dark: #0c4d4b; --yellow: #f4c95d;
    --coral: #e9785b; --shadow: 0 18px 50px rgba(27,43,43,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; }
  h1, h2, .serif { font-family: Georgia, 'Times New Roman', serif; }

  /* ---- header ---- */
  header { background: var(--teal-dark); color: #f7f3e9; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; background: var(--yellow); color: var(--teal-dark); font-weight: 800; font-family: Arial, sans-serif; font-size: 13px; border-radius: 10px 10px 10px 2px; flex-shrink: 0; }
  header h1 { font-size: 17px; margin: 0; line-height: 1.15; font-weight: 500; }
  header small { display: block; margin-top: 3px; color: #b9d4cb; font: 10px Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }

  /* ---- buttons ---- */
  .btn { background: var(--teal); color: #fff; border: none; padding: 10px 18px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .15s, transform .1s, opacity .15s; }
  .btn:hover { background: var(--teal-dark); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.secondary { background: transparent; color: var(--teal-dark); border: 1px solid var(--line); }
  .btn.secondary:hover { background: #eef1ec; }
  .btn.danger { background: var(--coral); }
  .btn.danger:hover { background: #d9654a; }
  .btn.small { padding: 7px 12px; font-size: 12px; border-radius: 7px; }
  .btn.ghost { background: rgba(255,255,255,.1); color: #f7f3e9; border: 1px solid rgba(255,255,255,.22); }
  .btn.ghost:hover { background: rgba(255,255,255,.18); }

  /* ---- login ---- */
  #login { max-width: 400px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; box-shadow: var(--shadow); }
  #login .brand-mark { margin: 0 auto 18px; width: 46px; height: 46px; font-size: 16px; }
  #login h2 { margin: 0 0 6px; font-size: 21px; text-align: center; font-weight: 500; }
  #login p { margin: 0 0 22px; text-align: center; color: var(--muted); font-size: 12.5px; }
  #login input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 12px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  #login input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,109,106,.12); }
  #login .btn { width: 100%; padding: 12px; font-size: 14px; }
  .error { color: var(--coral); font-size: 12.5px; min-height: 18px; margin-top: 10px; text-align: center; }

  /* ---- layout ---- */
  main { max-width: 1280px; margin: 0 auto; padding: 28px 22px 60px; display: none; }
  .layout { display: grid; grid-template-columns: 400px minmax(0,1fr); gap: 22px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel-head strong { font-size: 14px; font-weight: 700; }
  .panel-head select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 12.5px; color: var(--ink); }
  .panel-head-actions { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: rgba(18,109,106,.03); }

  /* ---- note list ---- */
  #list { max-height: 72vh; overflow: auto; }
  .note-row { padding: 14px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
  .note-row:last-child { border-bottom: none; }
  .note-row:hover { background: rgba(18,109,106,.05); }
  .note-row.active { background: rgba(18,109,106,.1); box-shadow: inset 3px 0 0 var(--teal); }
  .note-row .row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .note-row .title { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-row .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .note-row .preview { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: #ede4c8; color: #7a611f; flex-shrink: 0; }
  .badge.approved { background: #dcefe2; color: #276a44; }
  .badge.rejected { background: #f6dede; color: #9a2f2f; }
  .badge.unknown { background: #e8e2cf; color: #6b5c1f; }

  .empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---- editor ---- */
  #editor { padding: 22px; }
  #editor label { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 5px; }
  #editor label:first-child { margin-top: 0; }
  #editor input, #editor select, #editor textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
    font-size: 13.5px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #editor input:focus, #editor select:focus, #editor textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,109,106,.1); }
  #editor textarea { min-height: 360px; font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 13px; line-height: 1.55; resize: vertical; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--line); }
  .placeholder { padding: 90px 24px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }

  /* ---- stats ---- */
  .stats-summary { display: flex; gap: 12px; padding: 22px 22px 0; }
  .stat-card { flex: 1; background: rgba(18,109,106,.05); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat-card .value { font-size: 22px; font-weight: 800; color: var(--teal-dark); font-family: Georgia, serif; }
  .stat-card .label { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .stats-section { padding: 22px; }
  .stats-section h3 { margin: 0 0 12px; font-size: 13px; font-weight: 700; }
  .stat-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .rank { flex-shrink: 0; width: 20px; color: var(--muted); font-weight: 700; }
  .stat-row .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-row .count { flex-shrink: 0; background: var(--teal); color: #fff; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 700; }

  /* ---- toast ---- */
  #toast { position: fixed; top: 18px; right: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .toast-item { background: var(--teal-dark); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 340px; animation: toast-in .2s ease both; }
  .toast-item.error { background: var(--coral); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- upload drop zone ---- */
  .drop-zone { border: 2px dashed var(--line); border-radius: 12px; padding: 36px 16px; text-align: center; color: var(--muted); cursor: pointer; font-size: 13px; transition: border-color .15s, background .15s; }
  .drop-zone:hover { border-color: #b7c4bd; }
  .drop-zone.drag { border-color: var(--teal); background: rgba(18,109,106,.06); color: var(--teal-dark); }
  .drop-zone small { display: block; margin-top: 6px; color: #9aa7a4; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">VA</div>
    <div>
      <h1 class="serif">Staff Assistant</h1>
      <small>Admin · Supabase</small>
    </div>
  </div>
  <button class="btn ghost small" id="logoutBtn" style="display:none">Đăng xuất</button>
</header>

<div id="login">
  <div class="brand-mark">VA</div>
  <h2 class="serif">Đăng nhập Admin</h2>
  <p>Nhập admin token để quản lý nội dung tri thức.</p>
  <input id="tokenInput" type="password" placeholder="Admin token" autocomplete="off">
  <button class="btn" id="loginBtn">Vào trang quản trị</button>
  <div class="error" id="loginError"></div>
</div>

<main id="app">
  <div id="toast"></div>
  <div class="layout">
    <div class="panel">
      <div class="panel-head">
        <strong class="serif">Danh sách note</strong>
        <select id="statusFilter">
          <option value="draft">Chờ duyệt (draft)</option>
          <option value="approved">Đã duyệt</option>
          <option value="rejected">Đã từ chối</option>
          <option value="all">Tất cả</option>
        </select>
      </div>
      <div class="panel-head-actions">
        <button class="btn small" id="newNoteBtn">+ Tạo note mới</button>
        <button class="btn small secondary" id="uploadBtn">Upload file</button>
        <button class="btn small secondary" id="statsBtn">Thống kê</button>
        <button class="btn small secondary" id="apiKeysBtn">API nhúng</button>
      </div>
      <div id="list"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><strong class="serif" id="editorTitle">Chọn một note để xem chi tiết</strong></div>
      <div id="editor"><div class="placeholder">Chọn note bên trái để xem và chỉnh sửa nội dung,<br>hoặc bấm "Tạo note mới" / "Upload file".</div></div>
    </div>
  </div>
</main>

<script>
const API = "/api/admin";
const DEPARTMENTS = ["Unassigned", "HR", "Finance", "Academic", "Admin"];
const ACCESS_LEVELS = ["staff", "manager", "admin"];
const STATUSES = ["draft", "approved", "rejected"];
let token = sessionStorage.getItem("admin_token") || "";
let notes = [];
let currentId = null;

function headers() { return { "X-Admin-Token": token, "Content-Type": "application/json" }; }

async function api(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: headers() });
  if (res.status === 401 || res.status === 503) {
    sessionStorage.removeItem("admin_token");
    showLogin(res.status === 503 ? "Server chưa cấu hình ADMIN_TOKEN." : "Token không hợp lệ.");
    throw new Error("unauthorized");
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Lỗi ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

async function apiUpload(path, formData) {
  const res = await fetch(API + path, { method: "POST", headers: { "X-Admin-Token": token }, body: formData });
  if (res.status === 401 || res.status === 503) {
    sessionStorage.removeItem("admin_token");
    showLogin(res.status === 503 ? "Server chưa cấu hình ADMIN_TOKEN." : "Token không hợp lệ.");
    throw new Error("unauthorized");
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Lỗi ${res.status}`);
  return body;
}

function toast(message, isError) {
  const container = document.getElementById("toast");
  const item = document.createElement("div");
  item.className = `toast-item ${isError ? "error" : ""}`;
  item.textContent = message;
  container.appendChild(item);
  setTimeout(() => item.remove(), 5000);
}

function showLogin(message) {
  document.getElementById("login").style.display = "block";
  document.getElementById("app").style.display = "none";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("loginError").textContent = message || "";
}

function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  loadNotes();
}

document.getElementById("loginBtn").onclick = () => {
  const value = document.getElementById("tokenInput").value.trim();
  if (!value) return;
  token = value;
  sessionStorage.setItem("admin_token", token);
  showApp();
};

document.getElementById("tokenInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter") document.getElementById("loginBtn").click();
});

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("admin_token");
  token = "";
  showLogin();
};

document.getElementById("statusFilter").onchange = loadNotes;

async function loadNotes() {
  const status = document.getElementById("statusFilter").value;
  try {
    notes = await api(`/notes?status=${status}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    document.getElementById("list").innerHTML = `<div class="empty">${error.message}</div>`;
    return;
  }
  renderList();
}

function renderList() {
  const list = document.getElementById("list");
  if (!notes.length) {
    list.innerHTML = '<div class="empty">Không có note nào.</div>';
    return;
  }
  list.innerHTML = notes.map(note => `
    <div class="note-row ${note.id === currentId ? 'active' : ''}" data-id="${note.id}">
      <div class="row-top">
        <div class="title">${escapeHtml(note.title)}</div>
        <span class="badge ${note.status}">${note.status}</span>
      </div>
      <div class="meta">${escapeHtml(note.department)} · v${escapeHtml(note.version)}</div>
      <div class="preview">${escapeHtml(note.preview)}</div>
    </div>
  `).join("");
  list.querySelectorAll(".note-row").forEach(row => {
    row.onclick = () => openNote(row.dataset.id);
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function openNote(id) {
  currentId = id;
  renderList();
  let note;
  try {
    note = await api(`/notes/detail?note_id=${encodeURIComponent(id)}`);
  } catch (error) {
    if (error.message === "unauthorized") return;
    alert(error.message);
    return;
  }
  document.getElementById("editorTitle").textContent = note.title || id;
  document.getElementById("editor").innerHTML = `
    <div class="meta-grid">
      <label>Tiêu đề</label><input data-field="title" value="${escapeHtml(note.title)}">
      <label>Phòng ban</label><select data-field="department">${departmentOptions(note.department)}</select>
      <label>Trạng thái</label><select data-field="status">${optionsFor(STATUSES, note.status)}</select>
      <label>Version</label><input data-field="version" value="${escapeHtml(note.version)}">
      <label>Quyền truy cập</label><select data-field="access_level">${optionsFor(ACCESS_LEVELS, note.access_level)}</select>
    </div>
    <label>Nội dung</label>
    <textarea id="contentBox">${escapeHtml(note.content)}</textarea>
    <div class="actions">
      <button class="btn" id="saveBtn">Lưu thay đổi</button>
      <button class="btn" id="approveBtn">Duyệt (approved)</button>
      <button class="btn secondary" id="rejectBtn">Từ chối</button>
      <button class="btn danger" id="deleteBtn">Xoá vĩnh viễn</button>
    </div>
  `;
  document.getElementById("saveBtn").onclick = () => saveNote(id);
  document.getElementById("approveBtn").onclick = () => setStatus(id, "approve");
  document.getElementById("rejectBtn").onclick = () => setStatus(id, "reject");
  document.getElementById("deleteBtn").onclick = () => deleteNote(id);
}

function optionsFor(values, selected) {
  const options = values.includes(selected) ? values : [selected, ...values];
  return options.map(opt => `<option value="${escapeHtml(opt)}" ${opt === selected ? "selected" : ""}>${escapeHtml(opt)}</option>`).join("");
}

function collectFields() {
  const fields = {};
  document.querySelectorAll("[data-field]").forEach(input => {
    fields[input.dataset.field] = input.value;
  });
  fields.content = document.getElementById("contentBox").value;
  return fields;
}

async function saveNote(id) {
  const body = collectFields();
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(body) });
    await loadNotes();
    toast("Đã lưu & đồng bộ AI.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function setStatus(id, action) {
  try {
    await api(`/notes/${action}?note_id=${encodeURIComponent(id)}`, { method: "POST" });
    await loadNotes();
    openNote(id);
    toast(action === "approve" ? "Đã duyệt & đồng bộ AI." : "Đã từ chối.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

async function deleteNote(id) {
  if (!confirm("Xoá vĩnh viễn note này?")) return;
  try {
    await api(`/notes?note_id=${encodeURIComponent(id)}`, { method: "DELETE" });
    currentId = null;
    resetEditor();
    await loadNotes();
    toast("Đã xoá.");
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

function resetEditor() {
  document.getElementById("editor").innerHTML = '<div class="placeholder">Chọn note bên trái để xem và chỉnh sửa nội dung,<br>hoặc bấm "Tạo note mới" / "Upload file".</div>';
  document.getElementById("editorTitle").textContent = "Chọn một note để xem chi tiết";
}

function departmentOptions(selected) {
  return DEPARTMENTS.map(dep => `<option value="${dep}" ${dep === selected ? "selected" : ""}>${dep}</option>`).join("");
}

function showNewNoteForm() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Tạo note mới";
  document.getElementById("editor").innerHTML = `
    <label>Tiêu đề</label>
    <input id="newTitle" placeholder="Vd: Quy định nghỉ phép 2026">
    <label>Phòng ban</label>
    <select id="newDepartment">${departmentOptions("Unassigned")}</select>
    <label>Nội dung (Markdown)</label>
    <textarea id="newContent" placeholder="Nhập nội dung quy định..."></textarea>
    <div class="actions">
      <button class="btn" id="createDraftBtn">Lưu nháp (draft)</button>
      <button class="btn secondary" id="createApprovedBtn">Lưu & Duyệt luôn</button>
    </div>
  `;
  document.getElementById("createDraftBtn").onclick = () => createNote("draft");
  document.getElementById("createApprovedBtn").onclick = () => createNote("approved");
}

async function createNote(status) {
  const title = document.getElementById("newTitle").value.trim();
  const department = document.getElementById("newDepartment").value;
  const content = document.getElementById("newContent").value.trim();
  if (!title || !content) { toast("Cần nhập tiêu đề và nội dung.", true); return; }
  try {
    const result = await api("/notes/create", {
      method: "POST",
      body: JSON.stringify({ title, department, content, status }),
    });
    await loadNotes();
    toast(status === "approved" ? "Đã tạo, duyệt & đồng bộ AI." : "Đã tạo note nháp.");
    openNote(result.id);
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
}

function showUploadForm() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Upload file";
  document.getElementById("editor").innerHTML = `
    <label>Phòng ban</label>
    <select id="uploadDepartment">${departmentOptions("Unassigned")}</select>
    <label>Tiêu đề (tuỳ chọn)</label>
    <input id="uploadTitle" placeholder="Để trống sẽ lấy theo tên file">
    <label>File</label>
    <div class="drop-zone" id="dropZone">Kéo thả file vào đây, hoặc bấm để chọn<br><small>.md .txt .csv .json .pdf .docx — tối đa 10MB</small></div>
    <input type="file" id="uploadFileInput" style="display:none" accept=".md,.txt,.csv,.json,.pdf,.docx">
    <p style="margin:14px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5">File sẽ được duyệt tự động và chatbot dùng được ngay — kiểm tra lại nội dung trong danh sách note nếu cần chỉnh sửa.</p>
    <div class="actions"><button class="btn" id="uploadSubmitBtn" disabled>Upload & duyệt tự động</button></div>
  `;
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("uploadFileInput");
  const submitBtn = document.getElementById("uploadSubmitBtn");
  let selectedFile = null;
  const setFile = (file) => {
    selectedFile = file;
    submitBtn.disabled = !file;
    dropZone.innerHTML = file ? `Đã chọn: <strong>${escapeHtml(file.name)}</strong>` : 'Kéo thả file vào đây, hoặc bấm để chọn<br><small>.md .txt .csv .json .pdf .docx — tối đa 10MB</small>';
  };
  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = () => setFile(fileInput.files?.[0] || null);
  dropZone.ondragover = (event) => { event.preventDefault(); dropZone.classList.add("drag"); };
  dropZone.ondragleave = () => dropZone.classList.remove("drag");
  dropZone.ondrop = (event) => {
    event.preventDefault();
    dropZone.classList.remove("drag");
    setFile(event.dataTransfer.files?.[0] || null);
  };
  submitBtn.onclick = async () => {
    if (!selectedFile) return;
    const form = new FormData();
    form.append("file", selectedFile);
    form.append("department", document.getElementById("uploadDepartment").value);
    const title = document.getElementById("uploadTitle").value.trim();
    if (title) form.append("title", title);
    try {
      await apiUpload("/upload", form);
      document.getElementById("statusFilter").value = "approved";
      await loadNotes();
      resetEditor();
      toast("Đã upload & duyệt tự động — chatbot dùng được ngay. Kiểm tra lại trong danh sách nếu cần.");
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
}

async function showStats() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "Thống kê câu hỏi";
  document.getElementById("editor").innerHTML = '<div class="placeholder">Đang tải thống kê...</div>';
  let data;
  try {
    data = await api("/analytics");
  } catch (error) {
    if (error.message !== "unauthorized") {
      document.getElementById("editor").innerHTML = `<div class="placeholder">${escapeHtml(error.message)}</div>`;
    }
    return;
  }
  const groundedRate = data.scanned_logs ? Math.round((data.grounded_count / data.scanned_logs) * 100) : 0;
  document.getElementById("editor").innerHTML = `
    <div class="stats-summary">
      <div class="stat-card"><div class="value">${data.scanned_logs}</div><div class="label">Lượt hỏi đã ghi nhận</div></div>
      <div class="stat-card"><div class="value">${groundedRate}%</div><div class="label">Có trích dẫn nguồn</div></div>
    </div>
    <div class="stats-section">
      <h3>Tài liệu được trích dẫn nhiều nhất</h3>
      ${renderStatRows(data.top_sources, (row) => row.source)}
    </div>
    <div class="stats-section" style="padding-top:0">
      <h3>Câu hỏi giống nhau được hỏi nhiều nhất</h3>
      ${renderStatRows(data.top_questions, (row) => row.question)}
    </div>
  `;
}

function renderStatRows(rows, getText) {
  if (!rows || !rows.length) return '<p style="font-size:12.5px;color:var(--muted)">Chưa có dữ liệu.</p>';
  return rows.map((row, index) => `
    <div class="stat-row">
      <span class="rank">${index + 1}</span>
      <span class="text" title="${escapeHtml(getText(row))}">${escapeHtml(getText(row))}</span>
      <span class="count">${row.count}</span>
    </div>
  `).join("");
}

function embedSnippet(key) {
  const src = `${window.location.origin}/?embed_key=${key}`;
  return `<iframe src="${src}" style="width:100%;height:640px;border:0;border-radius:12px;" title="Viet Anh Staff Assistant" allow="clipboard-write"></iframe>`;
}

async function showApiKeys() {
  currentId = null;
  renderList();
  document.getElementById("editorTitle").textContent = "API nhúng cho trang nội bộ khác";
  document.getElementById("editor").innerHTML = '<div class="placeholder">Đang tải danh sách key...</div>';
  await renderApiKeys();
}

async function renderApiKeys() {
  let keys;
  try {
    keys = await api("/api-keys");
  } catch (error) {
    if (error.message !== "unauthorized") {
      document.getElementById("editor").innerHTML = `<div class="placeholder">${escapeHtml(error.message)}</div>`;
    }
    return;
  }
  const rows = keys.map((k) => `
    <div class="stats-section" style="padding:16px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div>
          <strong style="font-size:13.5px">${escapeHtml(k.label)}</strong>
          <span class="badge ${k.status === 'active' ? 'approved' : 'rejected'}" style="margin-left:8px">${k.status}</span>
        </div>
        <div style="display:flex;gap:8px">
          ${k.status === 'active' ? `<button class="btn secondary small" data-revoke="${k.id}">Thu hồi</button>` : ""}
          <button class="btn danger small" data-delete="${k.id}">Xoá</button>
        </div>
      </div>
      <p style="margin:8px 0 0;font-size:11.5px;color:var(--muted)">Domain được phép nhúng: <strong>${escapeHtml(k.allowed_origin)}</strong> · Tạo lúc ${new Date(k.created_at).toLocaleString('vi-VN')}${k.last_used_at ? ` · Dùng gần nhất ${new Date(k.last_used_at).toLocaleString('vi-VN')}` : ''}</p>
      <label style="margin-top:10px">Mã nhúng (copy nguyên đoạn dán vào trang kia)</label>
      <textarea readonly style="min-height:70px;font-size:11.5px" onclick="this.select()">${escapeHtml(embedSnippet(k.key))}</textarea>
    </div>
  `).join("") || '<p style="font-size:12.5px;color:var(--muted)">Chưa có API key nào.</p>';

  document.getElementById("editor").innerHTML = `
    <label>Tên trang nhúng</label>
    <input id="newKeyLabel" placeholder="Vd: Intranet phòng HR">
    <label>Domain được phép nhúng (chỉ domain này mới hiển thị được, vd https://intranet.truongvietanh.com)</label>
    <input id="newKeyOrigin" placeholder="https://...">
    <div class="actions"><button class="btn" id="createKeyBtn">Tạo API key</button></div>
    <div style="margin-top:22px">${rows}</div>
  `;

  document.getElementById("createKeyBtn").onclick = async () => {
    const label = document.getElementById("newKeyLabel").value.trim();
    const allowed_origin = document.getElementById("newKeyOrigin").value.trim();
    if (!label || !allowed_origin) { toast("Cần nhập tên và domain.", true); return; }
    try {
      await api("/api-keys", { method: "POST", body: JSON.stringify({ label, allowed_origin }) });
      toast("Đã tạo API key.");
      await renderApiKeys();
    } catch (error) {
      if (error.message !== "unauthorized") toast(error.message, true);
    }
  };
  document.querySelectorAll("[data-revoke]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        await api(`/api-keys/${btn.dataset.revoke}/revoke`, { method: "POST" });
        toast("Đã thu hồi key.");
        await renderApiKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
  document.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm("Xoá vĩnh viễn API key này?")) return;
      try {
        await api(`/api-keys/${btn.dataset.delete}`, { method: "DELETE" });
        toast("Đã xoá key.");
        await renderApiKeys();
      } catch (error) {
        if (error.message !== "unauthorized") toast(error.message, true);
      }
    };
  });
}

document.getElementById("newNoteBtn").onclick = showNewNoteForm;
document.getElementById("uploadBtn").onclick = showUploadForm;
document.getElementById("statsBtn").onclick = showStats;
document.getElementById("apiKeysBtn").onclick = showApiKeys;

if (token) { showApp(); } else { showLogin(); }
</script>
</body>
